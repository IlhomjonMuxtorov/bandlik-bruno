info:
  name: 2. Own Organization Profile
  type: http
  seq: 2
http:
  method: GET
  url: '{{base_url}}/admin/my/organization'
  auth: inherit
docs: |-
  Kirgan (logged-in) partner login'ining **O'Z tashkiloti profili** — `stats`
  bloki bilan birga. Tashkilot `id` YUBORILMAYDI: u token'dan aniqlanadi (org
  egasi `organization.user_id` yoki xodim `organization_employee.user_id`),
  shuning uchun boshqa tashkilot ma'lumotini bu yerdan o'qib bo'lmaydi.

  Bu endpoint `GET /admin/xba/<o'z id>` ning o'rnini bosadi: eski yo'l platforma
  katalogi bo'lgan `xbaView` ruxsatini talab qiladi, bu esa `xba_*` rollariga
  seed qilinmagan. XBA agent login'i uchun **agentning o'zi** qaytadi (root XBA
  emas) — root XBA `GET /admin/xba/<root id>` orqali ochiladi.

  **Auth:** `admin_token`. **Permission:** `ownOrganizationView`.

  ### 📋 Headers

  | Header | Required | Description |
  |---|:---:|---|
  | `Authorization` | ✅ | `Bearer {{ _.admin_token }}` |
  | `Accept-Language` | ➖ | `uz` \| `ru` \| `en`. Default: `uz` |

  ### 📤 Response

  `200` — `OrganizationOutputDTO` + `capabilities` bloki:

  **Asosiy maydonlar** (`/admin/xba/<id>` javobi bilan bir xil):
  asosiy rekvizitlar, manzil munosabatlari, litsenziya fayllari, logo, yaratuvchi/
  o'zgartiruvchi, hamda `stats` bloki
  ({@see OrganizationRepository::getOrgStats} — `total_revenue`, `clients_count`,
  `services_count`, `active_employees`, `active_vacancies`, `archived_vacancies`;
  pul maydonlari so'mda).

  **`capabilities` bloki** (frontend karochka tanlangan qilimlari uchun):

  | Field | Type | Description |
  |---|---|---|
  | `services_mode` | string | Xizmat rejimi: `catalog` — xizmatlar katalogi (XBA, Visa, Notarius, Logistika, Ish beruvchi, Rekruter); `courses` — o'quv kurslar (O'quv markazi); `provider` — sug'urta tarifi (Sug'urta); o'qiladi `/admin/educational-courses` (courses) yoki Agrosug'urta API (provider) uchun |
  | `can_manage_services` | bool | `true` = katalog xizmatlarini boshqarish ruxsati bor (katalog rejimi + `{type}ServiceManage`); courses rejimi — `courseManage` ruxsati; provider rejimi — `false` |
  | `can_manage_employees` | bool | `true` = tashkilot xodimlarini boshqarish ruxsati bor (`{type}EmployeeManage`; XBA uchun `employeeManage`) |
  | `can_view_insurance_policies` | bool | `true` = faqat Sug'urta tashkiloti, `insuranceOwnPolicyView` ruxsati bilan |

  > Faqat kartochka raqamlari kerak bo'lsa, yengilroq `1. Own Organization Stats`
  > (`/admin/my/organization/stats`) ishlatilsin.

  ### ⚠️ Errors

  | Code | Reason |
  |---|---|
  | `401` | Token yo'q yoki eskirgan |
  | `403` | `ownOrganizationView` yo'q; yoki aktorda tashkilot yo'q (masalan platform super-admin) |
  | `404` | Tashkilot topilmadi |
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
