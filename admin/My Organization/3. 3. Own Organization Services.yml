info:
  name: 3. Own Organization Services
  type: http
  seq: 3
http:
  method: GET
  url: '{{base_url}}/admin/my/organization/services?page=1&per-page=20'
  auth: inherit
docs: |-
  Kirgan (logged-in) partner o'z tashkilotining xizmatlar katalogi (katalog-rejim
  turlar uchun), har bir xizmat uchun buyurtma statistikasi bilan. Faqat
  katalog-rejimi turlar (XBA, Visa, Notarius, Logistika, Ish beruvchi,
  Rekruter) uchun; Sug'urta va O'quv markazlari uchun 403.

  **Auth:** `admin_token`. **Permission:** `{type}ServiceManage` (xizmatni boshqarish).

  ### 🔎 Query Parameters

  | Param | Type | Required | Description |
  |---|---|:---:|---|
  | `q` | string | ➖ | Xizmat nomi bo'yicha qidiruv |
  | `is_active` | bool | ➖ | `true` \| `false` — faollik bo'yicha filtr |
  | `page` | int | ➖ | Sahifa raqami. Default: `1` |
  | `per-page` | int | ➖ | Bir sahifada qatorlar. Default: `20` |
  | `sort` | string | ➖ | `id` \| `sort_order` \| `price` \| `created_at` (`-` bilan teskari). Default: `sort_order` ↑, keyin `id` ↑. |

  ### 📋 Headers

  | Header | Required | Description |
  |---|:---:|---|
  | `Authorization` | ✅ | `Bearer {{ _.admin_token }}` |
  | `Accept-Language` | ➖ | `uz` \| `ru` \| `en`. Default: `uz` |

  ### 📤 Response

  `200` — `OrganizationServiceOutputDTO[]` (paginatsiyalangan):

  | Field | Type | Description |
  |---|---|---|
  | `id` | int | Xizmat ID |
  | `organization_id` | int | Tashkilot ID |
  | `name` | object | Ko'p tillik nom (`{uz, ru, en}`) |
  | `name_localized` | string | Joriy tilda lokalizatsiyalangan nom |
  | `description` | object \| null | Ko'p tillik tavsif |
  | `description_localized` | string \| null | Joriy tilda tavsif |
  | `price` | int | Xizmat narxi so'mda (so'm, tiyin EMAS) |
  | `is_active` | bool | `true` = faol, `false` = o'chirilgan |
  | `sort_order` | int | Saralash tartibi |
  | `in_progress_count` | int | Jarayonda davom etayotgan buyurtmalar soni |
  | `completed_count` | int | Yakunlangan buyurtmalar soni |
  | `cancelled_count` | int | Bekor qilingan buyurtmalar soni |
  | `revenue` | int | Ushbu xizmatdan olingan jami daromad so'mda |
  | `created_at` | int | Unix timestamp |
  | `updated_at` | int | Unix timestamp |

  ### ⚠️ Errors

  | Code | Reason |
  |---|---|
  | `400` | Validatsiya xatosi (noto'g'ri query parametrlari) |
  | `401` | Token yo'q yoki eskirgan |
  | `403` | `ownOrganizationView` yo'q; tashkilot yo'q; yoki xizmatlarni boshqarish ruxsati yo'q |
  | `404` | Tashkilot topilmadi |
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
