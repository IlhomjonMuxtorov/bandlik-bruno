info:
  name: 1. Notification — Index
  type: http
  seq: 1
http:
  method: GET
  url: '{{base_url}}/admin/notifications?unread=0&per-page=20'
  headers:
  - name: Accept-Language
    value: uz
  auth: inherit
docs: |
  Joriy (autentifikatsiya qilingan) foydalanuvchining o'z bildirishnomalari,
  eng yangisidan boshlab. In-app notification-center (Eslatmalar paneli) shu
  ro'yxatdan foydalanadi. Har bir foydalanuvchi **faqat o'zining**
  bildirishnomalarini ko'radi (maxsus permission talab qilinmaydi — token
  yetarli). `title`/`body` `Accept-Language` bo'yicha render qilinadi.

  `DELETE /admin/notifications/{id}` yoki `DELETE /admin/notifications` bilan
  o'chirilgan (soft delete) qatorlar bu ro'yxatda **hech qachon** qaytmaydi.

  **Auth:** `admin_token`.

  ### 🔎 Query Parameters

  | Param | Type | Required | Description |
  |---|---|:---:|---|
  | `unread` | int | ➖ | `1` — faqat o'qilmaganlar; `0`/yo'q — barchasi. Default: `0`. |
  | `per-page` | int | ➖ | Sahifadagi soni (1–100). Default: `20`. |
  | `page` | int | ➖ | Sahifa raqami. Default: `1`. |

  ### 📋 Headers

  | Header | Required | Description |
  |---|:---:|---|
  | `Authorization` | ✅ | `Bearer {admin_token}` |
  | `Accept-Language` | ➖ | `uz` \| `ru` \| `en`. Default: `uz` |

  ### 📤 Response

  `data.items[]` — bildirishnoma, `data.pagination` — sahifalash metadatasi.

  | Field | Type | Description |
  |---|---|---|
  | `id` | int | Bildirishnoma ID |
  | `type` | string | Turi: `contract_pending_approval` \| `vacancy_application_received` \| `cv_contact_changed_by_org` \| `cv_incomplete_reminder` |
  | `title` | string | Render qilingan sarlavha (so'ralgan til) |
  | `body` | string | Render qilingan matn (so'ralgan til) |
  | `url` | string \| null | **Deprecated** — `web_url` bilan bir xil qiymat. Frontend `web_url` ga o'tgach olib tashlanadi. |
  | `web_url` | string \| null | Panel ichida bosilganda o'tiladigan **nisbiy** yo'l (`/dashboard/...`). Panel o'z origin'ini oldiga qo'yadi. Faqat mobil hodisalarda `null`. |
  | `mobile_url` | string \| null | Mobil ilova deep-link'i (`xba://...`). Faqat web hodisalarda `null`. |
  | `contract_id` | int \| null | `contract_*` turlari uchun tegishli shartnoma ID; boshqa turlarda `null` |
  | `vacancy_id` | int \| null | `vacancy_*` turlari uchun vakansiya ID; boshqa turlarda `null` |
  | `application_id` | int \| null | `vacancy_application_*` turlari uchun ariza ID; boshqa turlarda `null` |
  | `is_read` | bool | O'qilgan holati |
  | `created_at` | int | Yaratilgan vaqt (unix, sekund) |

  ### 🔔 Notification turlari

  | `type` | Qachon | Kim oladi |
  |---|---|---|
  | `contract_pending_approval` | Shartnoma yuklandi, tasdiqlash kutilmoqda | `contractApprove`/`contractReject` huquqidagilar + `superadmin` |
  | `vacancy_application_received` | Nomzod XBA joylagan vakansiyaga ariza topshirdi | Vakansiya XBA tashkilotining barcha active xodimlari (user'i bor) |
  | `cv_contact_changed_by_org` | XBA xodimi CV'dagi telefon/emailni tahrirladi | Nomzod (mobil) |
  | `cv_incomplete_reminder` | Rezyume to'liq emasligi haqida davriy eslatma (cron) | Nomzod (mobil) |

  > Nomzodga tegishli qo'shimcha turlar (`application_reviewed`,
  > `application_accepted`, `application_rejected`, `process_group_started`,
  > `process_group_confirmed`, `process_pipeline_completed`, `payment_overdue`)
  > **faqat** mobil inbox'ga yoziladi — admin panelda ular hech qachon
  > ko'rinmaydi. Ta'rifi: mobile collection → `Notifications`.

  ### 🔗 Deep-linklar

  `web_url` / `mobile_url` DB'da saqlanmaydi — o'qish paytida `type` va `data`
  asosida [`DeeplinkResolver`](../../../common/services/DeeplinkResolver.php)
  tomonidan hisoblanadi. Marshrut o'zgarsa eski qatorlar ham yangi linkni beradi.

  | `type` | `web_url` | `mobile_url` |
  |---|---|---|
  | `contract_pending_approval` | `/dashboard/contracts?contractTab=pending&contractId={id}` | `null` |
  | `vacancy_application_received` | `/dashboard/vacancies/{vacancy_id}?tab=applications&applicationId={id}` | `null` |
  | `cv_contact_changed_by_org` | `null` | `xba://cv/contacts?cv_id={id}` |
  | `cv_incomplete_reminder` | `null` | `xba://cv?cv_id={id}` |

  > Chat push'lari (`new_message` / `incoming_call`) inbox qatori **yaratmaydi** —
  > ular faqat FCM orqali keladi. To'liq deeplink jadvali: `docs/FCM_PAYLOADS.md`.
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
