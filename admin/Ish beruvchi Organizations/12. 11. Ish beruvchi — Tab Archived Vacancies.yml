info:
  name: '11. Ish beruvchi — Tab: Archived Vacancies'
  type: http
  seq: 12
http:
  method: GET
  url: '{{base_url}}/admin/employers/1/archived-vacancies?per-page=20'
  auth: inherit
docs: |-
  Ish beruvchi tashkilotning **Arxiv vakansiyalar** tabi — faqat `status = archived`
  vakansiyalar.

  > **Bog'lanish qoidasi:** vakansiyalar `recruiter_id = <employer id>` bo'yicha filtrlanadi
  > (`organization_id` doim XBA). Active Vacancies tabidagi qoida bilan bir xil.

  **Auth:** `admin_token`.

  ### 🔎 Query Parameters

  `Active Vacancies` bilan bir xil (`q`, `country_id`, `city_id`, `page`, `per-page`).
  `status` filtri bu yerda e'tiborga olinmaydi — natija doim arxivlangan yozuvlar.

  ### 📤 Response

  `Active Vacancies` bilan bir xil shakl — `OrganizationVacancyListItemOutputDTO`
  (`title`, `location`, `salary_*`, `candidates_count`, `filled`, `hiring_quota`,
  `status`, `status_label`).

  > **Org-scope (ADR 0014):** non-admin aktor faqat o'zi ishlaydigan tashkilotni
  > ocha oladi — begona id **`404`** qaytaradi (ataylab `403` emas: API begona
  > tashkilot mavjudligini tasdiqlamaydi). Ko'rinish qoidasi Index faylida.
  >
  > ⚠️ **Buzuvchi:** ro'yxat endi faqat **aktorning o'z** vakansiyalarini
  > qaytaradi. Ilgari bu yerda ish beruvchining barcha vakansiyalari chiqardi —
  > jumladan boshqa agentliknikini ham. Bo'sh natija normal holat.
