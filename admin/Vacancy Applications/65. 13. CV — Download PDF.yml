info:
  name: CV — Download PDF
  type: http
  seq: 65
http:
  method: GET
  url: '{{base_url}}/admin/candidate-cv/{{cv_id}}/download-pdf?template=europass&documents=1'
  params:
  - name: template
    value: europass
    type: query
  - name: documents
    value: '1'
    type: query
  headers:
  - name: Accept
    value: application/pdf
  auth: inherit
docs: 'Nomzod CV-sini PDF fayl sifatida yuklab oladi — paneldagi "Yuklab olish
  (PDF)" tugmasining server tomonidagi ekvivalenti. Shablon `?template=` bilan
  tanlanadi va **saqlanmaydi**.


  **Auth:** `admin_token`. Ruxsat aktyor doirasi bo''yicha tekshiriladi
  (`assertCvWithinActorScope`) — CV kamida bitta o''z vakansiyangizga ariza
  bergan bo''lishi kerak.


  > Bu endpoint `cv_id` bo''yicha ishlaydi (ariza ID bo''yicha emas): bitta CV
  bir nechta arizada qatnashishi mumkin. `cv_id` ni
  `GET admin/vacancy-applications/<id>/cv` javobidan oling.


  **Rezyume ≠ ekrandagi CV.** PDF ataylab paneldagi CV ko''rinishidan tor: u
  tizimdan tashqariga chiqadigan hujjat, shu bois ichki va shaxsiy maydonlar
  chiqmaydi.


  **Chap ustunda — aynan 6 qator, shu tartibda:** passport raqami, tug''ilgan sana,
  tug''ilgan shahri (`birth_place.country, .address`), yashash shahri
  (`registration.country, .region` \| `.district`), millati
  (`passport.nationality.name`, bo''lmasa `passport.citizenship.name`), jinsi
  (`personal.sex_label`). Europass/Klassikda shu ustunda biriktirilgan hujjatlar
  ro''yxati ham turadi.


  **O''ng ustunda — CV to''ldirish qadamlari tartibida** (`CvCompletionDTO` ning 12
  bandi va endpointlardagi qadam raqamlari): ta''lim (3) → mehnat faoliyati (4) →
  oila a''zolari (5) → tillar (7) → hujjatlar (8) → haydovchilik guvohnomasi (9) →
  trening va sertifikatlar (10) → ko''nikmalar → qo''shimcha bo''limlar (12.x —
  xobbi, loyihalar, nashrlar, konferensiyalar va h.k., har biri **alohida** bo''lim)
  → huquqiy holat → tibbiy ma''lumotlar. Ko''nikmalar va tekshiruv bo''limlarining
  o''z qadami yo''q, shu bois raqamlilardan keyin turadi. Europass/Klassikda
  hujjatlar chap ustunda, shu sabab bu joylashuv faqat Zamonaviy va Professionalda
  ko''rinadi. **To''ldirilmagan bo''lim umuman chiqmaydi** (bo''sh sarlavha ham
  qolmaydi).


  **PDF''ga CHIQMAYDIGAN maydonlar** (JSON javobda va ekranda qoladi): JSHSHIR,
  STIR, xorijiy passport raqami, hisoblangan umumiy ish tajribasi, aloqa bloki
  (telefon, email, qo''shimcha telefon, aloqa shaxsi), to''liq yashash manzili
  (12 maydonli MVD bloki), viza tarixi, hamda CV telemetriyasi — rezyume nomi,
  holati, to''ldirilganlik foizi, ko''rishlar, tashriflar, takliflar.


  **Brend belgisi** har to''rt shablonda o''ng ustun mazmuni bilan bir chizizda
  tugaydi; Zamonaviy shablonning quyuq sarlavhasida oq variant ishlatiladi.


  > **JSHSHIR (PINFL) PDF-ga chiqmaydi** (ADR-380). JSON javobda u allaqachon
  maskalangan keladi (ADR-360), PDF-da esa qator umuman render qilinmaydi. Xuddi
  shu mantiq bilan aloqa ma''lumotlari, to''liq manzil, viza tarixi va CV
  telemetriyasi ham chiqarilmaydi (ADR-394).


  > **Haydovchilik guvohnomasi bloki** PDF-da faqat toifalar ro''yxatini beradi
  (`B, C, DE` — guvohnoma kartasidagi tartibda). Har toifa uchun alohida berilgan
  sana / amal qilish muddati (`driver.categories_detail`) PDF-ga **chiqmaydi**,
  faqat JSON javobda mavjud.


  ### 📋 Path Params


  | Param | Type | Description |

  |---|---|---|

  | `cv_id` | int | CV ID (`header.cv_id`) |


  ### 🔎 Query Parameters


  | Param | Type | Required | Description |

  |---|---|:---:|---|

  | `template` | string | ➖ | Shablon: `europass` \| `modern` \| `professional`
  \| `classic`. Default: `europass`. Noma''lum qiymat `europass` ga qaytadi. |

  | `documents` | bool | ➖ | `1` — biriktirilgan hujjatlar nomlari nuqtali
  ro''yxat bo''lib chiqadi (fayllarning o''zi qo''shilmaydi). `0` — hujjatlar
  bo''limi va bo''limlar ichidagi fayllar umuman chiqmaydi. Default: `1`. |


  ### 📋 Headers


  | Header | Required | Description |

  |---|:---:|---|

  | `Authorization` | ✅ | `Bearer {admin_token}` |

  | `Accept` | ✅ | `application/pdf` |

  | `Accept-Language` | ➖ | `uz` \| `ru` \| `en`. Default: `uz` |


  ### 📤 Response


  Binary PDF fayl (A4, chekkalari 8mm).


  | Header | Value |

  |---|---|

  | `Content-Type` | `application/pdf` |

  | `Content-Disposition` | `attachment; filename="<F.I.Sh>.pdf"` |

  | `Access-Control-Expose-Headers` | `Content-Disposition, Content-Length` |


  > **Fayl nomi frontendda.** Brauzer cross-origin `fetch()` da JS-ga faqat
  CORS-safelisted headerlarni beradi, shu bois server `Content-Disposition` va
  `Content-Length` ni `Access-Control-Expose-Headers` orqali ochadi — usiz
  `response.headers.get(''content-disposition'')` doim `null` qaytardi.


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `401` | Token yo''q yoki eskirgan |

  | `403` | CV sizning vakansiyalaringizdan birortasiga ham ariza bermagan |

  | `404` | CV topilmadi |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
