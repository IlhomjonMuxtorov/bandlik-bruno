info:
  name: 4a. CV — Download PDF
  type: http
  seq: 65
http:
  method: GET
  url: '{{base_url}}/admin/candidate-cv/1/download-pdf?template=europass'
  params:
  - name: template
    value: europass
    type: query
    enabled: true
  headers:
  - name: Accept
    value: application/pdf
  - name: Accept-Language
    value: uz
  auth: inherit
docs: 'Nomzod CV-sini PDF fayl sifatida yuklab oladi. Endpoint **`cv_id` bo''yicha**
  kalitlangan (ariza ID emas): panelda `cv_id` allaqachon `GET
  /admin/vacancy-applications/<id>/cv` javobidan olingan bo''ladi, va bitta CV bir
  nechta arizaga biriktirilishi mumkin. Uchta shablondan biri tanlanadi
  (`?template=`) — uchalasi ham bir xil bo''limlarni bir xil tartibda chiqaradi,
  faqat ustun tuzilishi va dizayni farq qiladi.


  **Auth:** `admin_token` + `applicationView` ruxsati.


  ### 📋 Path Params


  | Param | Type | Description |

  |---|---|---|

  | `cv_id` | int | CV ID — `GET /admin/vacancy-applications/<id>/cv` javobidagi
  `header.cv_id`. |


  ### 🔎 Query Parameters


  | Param | Type | Required | Description |

  |---|---|:---:|---|

  | `template` | string | ➖ | PDF ko''rinishi — admin paneldagi "Shablonlar"
  ro''yxati bilan bir xil: `europass` (default — to''q ko''k chap panel: rasm,
  asosiy ma''lumotlar, aloqa, hujjatlar) \| `modern` (to''q rangli yuqori banner,
  so''ng tor chap + keng o''ng ustun, sarlavhalar to''ldirilgan tasmada) \|
  `professional` (yengil header karta + aloqa qatorlari, ko''k urg''uli
  sarlavhalar) \| `classic` (och kulrang chap panel, ko''k sarlavhalar).
  Noto''g''ri yoki bo''sh qiymat → `europass` (400 qaytarilmaydi). |


  > Shablon **saqlanmaydi** — har so''rovda tanlanadi. PDF admin paneldagi CV
  ko''rinishi bilan bir xil bo''limlarni chiqaradi (huquqiy holat, tibbiy
  ma''lumotlar va rezyume holati ham). Fayllar yuklab olinmaydi — faqat
  "Biriktirilgan" deb belgilanadi.


  ### 📋 Headers


  | Header | Required | Description |

  |---|:---:|---|

  | `Authorization` | ✅ | `Bearer {admin_token}` |

  | `Accept` | ✅ | `application/pdf` |

  | `Accept-Language` | ➖ | `uz` \| `ru` \| `en`. Default: `uz` |


  ### 📤 Response


  Binary PDF fayl. Bandlik logosi faqat 1-sahifada chiqadi; har sahifa pastida
  `{sahifa} / {jami}` raqami bo''ladi.


  | Header | Value |

  |---|---|

  | `Content-Type` | `application/pdf` |

  | `Content-Disposition` | `attachment; filename="<F.I.Sh>.pdf"` |


  > **JSHSHIR maskalangan** — PDF-da faqat oxirgi 4 raqam ko''rinadi (mobil
  endpoint nomzodning o''ziga to''liq qiymatni beradi).


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `401` | Token yo''q / eskirgan |

  | `403` | `applicationView` ruxsati yo''q; yoki foydalanuvchi tashkilotga
  bog''lanmagan |

  | `404` | CV topilmadi, **yoki** CV so''rovchining vakansiyalaridagi hech bir
  arizaga biriktirilmagan (mavjudligi oshkor qilinmaydi) |

  | `406` | `Accept` sarlavhasi `application/pdf` yoki `application/json` emas |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
