info:
  name: CV — Download Archive (ZIP)
  type: http
  seq: 66
http:
  method: GET
  url: '{{base_url}}/admin/candidate-cv/{{cv_id}}/download-archive?template=europass'
  params:
  - name: template
    value: europass
    type: query
  - name: translation
    value: ''
    type: query
    disabled: true
  headers:
  - name: Accept
    value: application/zip
  - name: Accept-Language
    value: uz
  auth: inherit
docs: 'Nomzod CV-sini **va unga biriktirilgan hujjat skanlarini** bitta ZIP fayl
  qilib yuklab oladi — rekruter hujjatlarni bittalab `file_url` orqali yuklab
  olmasligi uchun.


  `download-pdf?documents=1` PDF ichida faqat hujjat **nomlarini** chop etadi
  (ADR-380); bu endpoint fayllarning o''zini beradi.


  > **Uzbek lotin yozuvi:** `Accept-Language: uz` bo''lganda MVD dan kelgan
  kirill matn (lavozim, kompaniya, manzil, tug''ilgan joy va h.k.) avtomatik lotinga
  o''giriladi ("Етакчи муҳандис" → "Yetakchi muhandis"). Rus tilidagi matn va ism-familiya
  o''zgarmaydi; bazadagi asl matn kirillcha qoladi. `ru`/`en` da o''zgarish yo''q.


  **Auth:** `admin_token`. Ruxsat PDF bilan bir xil: `applicationView` +
  aktyor doirasi (`assertCvWithinActorScope`) — CV kamida bitta o''z
  vakansiyangizga ariza bergan bo''lishi kerak. Arxiv JSON CV''da bo''lmagan
  hech narsani ochmaydi (hujjat `file_url` lari allaqachon CV javobida bor).


  > Endpoint `cv_id` bo''yicha ishlaydi (ariza ID bo''yicha emas) — bitta CV bir
  nechta arizada qatnashishi mumkin. JSHSHIR maskalangan.


  ### 📦 ZIP tuzilmasi


  ```

  RUSTAMOV_JAVOHIR.zip

  ├── RUSTAMOV_JAVOHIR.pdf                  ← download-pdf bilan bir xil nom/mazmun

  ├── Hujjatlar/

  │   ├── 01 Passport.pdf

  │   └── 02 Xorijiy passport.pdf

  └── Haydovchilik guvohnomasi sertifikatlari/

      └── 01 ADR sertifikati.jpg

  ```


  - **Doirasi — CV''ning "Hujjatlar" qadami:** `candidate_cv_document` va
  `candidate_cv_driver_certificate` orqali biriktirilgan fayllar. Diplom,
  tavsiyanoma, kurs sertifikati, viza va loyiha fayllari arxivga **kirmaydi**.

  - Papka nomlari `Accept-Language` tiliga tarjima qilinadi.

  - Hujjat biriktirilmagan bo''lsa ham `200` va ZIP qaytadi — ichida faqat PDF.

  - Fayli o''chgan yoki `status != ready` biriktirma jimgina o''tkazib yuboriladi.

  - `?documents=` **yo''q**: arxiv ta''rifan hujjatlar bilan eksport.


  ### 📋 Path Params


  | Param | Type | Description |

  |---|---|---|

  | `cv_id` | int | CV ID (`GET admin/vacancy-applications/<id>/cv` javobidan) |


  ### 🔎 Query Parameters


  | Param | Type | Required | Description |

  |---|---|:---:|---|

  | `template` | string | ➖ | ZIP ichidagi PDF shabloni: `europass` \| `modern`
  \| `professional` \| `classic`. Default: `europass`. Noma''lum qiymat
  `europass` ga qaytadi. |

  | `translation` | string | ➖ | `en` \| `ru` — ZIP ichidagi PDF **saqlangan
  tarjima** bilan chop etiladi (PDF tili shu tilga o''tadi; hujjat fayllari
  o''zgarmaydi). Permission `cvTranslationView` kerak (yo''q bo''lsa `403`);
  noma''lum til — `404`. Javobda `X-Cv-Translation-Status: complete` \| `stale`
  \| `incomplete` header''i qaytadi — `stale`/`incomplete` bo''lsa PDF tarjima va
  asl matn aralashmasi. Yuklashda Gemini chaqirilmaydi. Default: yo''q. |


  ### 📋 Headers


  | Header | Required | Description |

  |---|:---:|---|

  | `Authorization` | ✅ | `Bearer {admin_token}` |

  | `Accept` | ✅ | `application/zip` — aks holda `406` qaytadi |

  | `Accept-Language` | ➖ | `uz` \| `ru` \| `en`. Default: `uz`. ZIP papka
  nomlari va PDF tili. |


  ### 📤 Response


  Binary ZIP fayl.


  | Header | Value |

  |---|---|

  | `Content-Type` | `application/zip` |

  | `Content-Disposition` | `attachment; filename="<F.I.Sh>.zip"` |

  | `Access-Control-Expose-Headers` | `Content-Disposition, Content-Length` |


  > **Fayl nomi frontendda.** Panel `fetch()` bilan yuklab oladi (JWT sababli
  oddiy `<a href>` ishlamaydi), shu bois `Content-Disposition` va
  `Content-Length` `Access-Control-Expose-Headers` orqali ochilgan.


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `401` | Token yo''q yoki eskirgan |

  | `403` | `applicationView` ruxsati yo''q yoki xodimning tashkiloti yo''q; yoki
  `?translation=` bilan `cvTranslationView` ruxsati yo''q |

  | `404` | CV topilmadi yoki CV sizning vakansiyalaringizga ariza bermagan
  (doiradan tashqari CV mavjudligi yashiriladi); yoki `?translation=` tili
  qo''llab-quvvatlanmaydi |

  | `406` | `Accept: application/zip` header yuborilmagan |

  | `500` | Arxiv faylni yaratib bo''lmadi (disk/runtime muammosi) |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
