http:
  method: PATCH
  url: '{{base_url}}/admin/vacancy-applications/1/cv/experience/1'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: "{\n  \"company_name\": \"ABC LLC\",\n  \"position\": \"Katta sotuv menejeri\"\
      ,\n  \"country_id\": 1,\n  \"city_id\": 1,\n  \"start_date\": \"01.02.2021\"\
