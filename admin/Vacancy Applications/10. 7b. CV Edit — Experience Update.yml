  auth: inherit
docs: 'Mavjud ish tajribasi yozuvini yangilaydi.


  ℹ️ **MVD''dan sinxronlangan yozuv** (`is_from_mvd=true`) — **qisman** muzlatilgan
  (mobil bilan bir xil qoida): elektron hukumat bergan `company_name`, `position`,
  `start_date`, `end_date` **o''zgarmaydi** — yuborilsa jim e''tiborga olinmaydi
  (`200`, DB o''zgarmaydi). MVD yubormaydigan `country_id`, `city_id`, `description`,
  `achievements`, `recommendation_file_id` tahrirlanadi. Audit log''ga faqat haqiqiy
  o''zgargan maydon tushadi.


  **Auth:** `applicationCvManage` — faqat `xba_admin` / `xba_manager`.


  ### 📥 Request Body

  Maydonlar `7a. Experience Create` bilan bir xil (`company_name`, `position`,
  `country_id`, `city_id`, `start_date`, `end_date`, `description`, `achievements`,
  `recommendation_file_id`). To''liq almashtirish semantikasi — yuborilmagan ixtiyoriy
  maydon `null` ga tushadi (istisno: `recommendation_file_id` yuborilmasa joriy fayl
  saqlanadi). MVD yozuvida muzlatilgan 4 maydon bundan mustasno — ular hech qachon
  o''zgarmaydi.


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `404` | Ariza / CV / tajriba yozuvi topilmadi |

  | `403` | Boshqa tashkilot yoki `applicationCvManage` huquqi yo''q |

  | `403` | Ariza faol emas (`applied`/`reviewed`/`accepted` emas) — CV endi
  tahrirlanmaydi |

  | `400` | Validatsiya |

  '
