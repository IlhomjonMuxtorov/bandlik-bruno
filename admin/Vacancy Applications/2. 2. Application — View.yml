http:
  method: GET
  url: '{{base_url}}/admin/vacancy-applications/1'
  auth: inherit
docs: 'Ariza tafsiloti.


  **Auth:** Admin yoki vakansiya egasi.


  ### 📤 Response (`data`)


  | Field | Type | Description |

  |---|---|---|

  | `reviewed_at` | int \| null | Ko''rib chiqilgan vaqt (unix). `null` — hali ko''rilmagan.
  |

  | `reviewed_by` | int \| null | Ko''rib chiqqan aktor `user.id`. `null` — hali ko''rilmagan.
  |

  | `reviewed_by_name` | string \| null | Ko''rib chiqqan aktorning to''liq ismi. `null`
  — aktor yozilmagan (migration''gacha yaratilgan ariza). |

  | `decided_at` | int \| null | Qaror sanasi (unix). `null` — qaror qabul qilinmagan.
  |

  | `decided_by` | int \| null | Tasdiqlagan/rad etgan aktor `user.id`. `null` — qaror
  qabul qilinmagan. |

  | `decided_by_name` | string \| null | Qaror qabul qilgan aktorning to''liq ismi.
  `null` — aktor yozilmagan. |


  > Aktor — admin yoki chat orqali qaror qabul qilgan XBA xodimi.


  > To''rt aktor maydoni **faqat admin/superadmin** tokeni bilan qaytadi. Vakansiya
  egasi (employer, XBA agenti) va mobil javobda ular umuman yuborilmaydi — boshqa
  tashkilot xodimining ismi oshkor bo''lmasligi kerak.


  ### 📤 Response — `contract_confirmation` (shartnoma imzo dalili)


  Nomzod shartnomani **MyID Face ID** orqali tasdiqlaganida yozilgan audit qatori.
  Faqat **detal ko''rinishda** va faqat admin/superadmin tokeni bilan qaytadi
  (ro''yxatda yo''q — har qator uchun qo''shimcha so''rov bo''lardi). `null` — hech qanday
  tasdiq boshlanmagan (masalan `contract_myid_confirmation_required = false` bo''lgan
  paytda qabul qilingan ariza).


  | Field | Type | Description |

  |---|---|---|

  | `status` | string | `pending` \| `confirmed` \| `failed` \| `expired`. Muvaffaqiyatli
  imzo — `confirmed`. |

  | `mode` | string | `secondary` — saqlangan MyID reuid bo''yicha; `primary` — bazadagi
  pasport bo''yicha. Ikkalasida ham nomzoddan pasport so''ralmaydi. |

  | `contract_file_url` | string \| null | Imzolangan shartnoma PDF snapshot''i (oxirida
  MyID tasdiq bloki). `null` — PDF yaratilmagan. |

  | `confirmed_at` | int \| null | Yuz tekshirilgan vaqt (unix). `null` — tasdiqlanmagan.
  |

  | `consumed_at` | int \| null | Tasdiq taklifni qabul qilishda sarflangan vaqt (unix).
  `null` — hali ishlatilmagan. |

  | `expires_at` | int | Tasdiq amal qilish muddati (unix). |

  | `comparison_value` | float \| null | MyID yuz o''xshashlik ko''rsatkichi 0..1. `null`
  — tekshirilmagan. **Faqat admin javobida.** |

  | `myid_job_id` | string \| null | MyID tekshiruv identifikatori — MyID tomonida
  dalilni izlash uchun. **Faqat admin javobida.** |

  | `face_image_url` | string \| null | Tasdiqlash paytida olingan yuz surati. `null` —
  klient rasm yubormagan. Nomzodning profil rasmidan alohida fayl. **Faqat admin
  javobida** (biometrik artefakt). |

  | `failure_reason` | string \| null | `identity_mismatch` \| `low_score` \|
  `myid_error` \| `expired`. `null` — xatolik bo''lmagan. |


  > Muvaffaqiyatsiz urinishlar ham saqlanadi — shartnomaga qarshi qilingan **har bir**
  yuz tekshiruvi tarixda qoladi. Ko''rsatiladigan qator: sarflangan tasdiq → yo''q bo''lsa
  eng oxirgi muvaffaqiyatli → yo''q bo''lsa eng oxirgi urinish.


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `404` | Ariza topilmadi |

  | `403` | Boshqa tashkilot |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
