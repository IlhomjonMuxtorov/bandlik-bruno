info:
  name: 2. Shartnoma — View
  type: http
  seq: 2
http:
  method: GET
  url: '{{base_url}}/admin/contracts/1'
  auth: inherit
docs: |
  Bitta shartnoma to'liq ma'lumoti.

  **Auth:** `admin_token` (`contractView` ruxsati).

  > **Org-scope (ADR 0009).** Tashkilot foydalanuvchisi faqat o'z tashkiloti (XBA agent uchun — root XBA ham) tomon
  > bo'lgan shartnomani ocha oladi. Begona shartnoma ID'si **404** qaytaradi (403
  > emas) — endpoint bunday shartnoma mavjudligini ham tasdiqlamaydi.

  ### 📤 Response

  `200` — `ContractOutputDTO` (Index'dagi element bilan bir xil shakl).

  ### ⚠️ Errors

  | Code | Reason |
  |---|---|
  | `404` | Shartnoma topilmadi, **yoki** boshqa tashkilotga tegishli |
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
