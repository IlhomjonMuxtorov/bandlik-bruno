info:
  name: 1. Shartnoma — Index (+ picker)
  type: http
  seq: 1
http:
  method: GET
  url: '{{base_url}}/admin/contracts?party_a_organization_id=&party_b_organization_id=&contract_type=&approval_status=&is_active='
  params:
  - name: party_a_organization_id
    value: ''
    type: query
    enabled: false
  - name: party_b_organization_id
    value: ''
    type: query
    enabled: false
  - name: contract_type
    value: ''
    type: query
    enabled: false
  - name: approval_status
    value: ''
    type: query
