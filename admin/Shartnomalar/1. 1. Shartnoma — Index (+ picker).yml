  auth: inherit
docs: |
  Ikki tomonlama shartnomalar ro'yxati. Bu endpoint vakansiya yaratishdagi
  **zanjir shartnoma picker**i sifatida ham ishlatiladi: har bir bo'g'in uchun
  `?party_a_organization_id=<bo'g'in boshi>&party_b_organization_id=<bo'g'in oxiri>`
  (+ `is_cancelled=false`) bilan filtrlanadi va faqat aynan shu ikki tomon
  o'rtasidagi aktiv shartnomalar qaytariladi. Hop 0 da `party_a` — vakansiyani
  boshqaruvchi XBA.

  **Auth:** `admin_token`.

  ### 🔎 Query Parameters

  | Param | Type | Required | Description |
  |---|---|:---:|---|
  | `party_a_organization_id` | int | ➖ | Buyurtmachi tomon (XBA yoki rekruter) bo'yicha filtr. Zanjir pickeri ikkalasini birga yuboradi. |
  | `party_b_organization_id` | int | ➖ | Jalb qilingan tomon (ish beruvchi yoki rekruter) bo'yicha filtr. |

  > **O'tish davri:** eski `xba_organization_id` / `organization_id` paramlari hali
  > mos ravishda `party_a` / `party_b` sifatida qabul qilinadi (yangi nom ustun
  > keladi). Panel yangi nomlarga o'tgach olib tashlanadi.
  | `contract_type` | string | ➖ | `vacancy` \| `yearly`. |
  | `approval_status` | string | ➖ | `pending` \| `approved` \| `rejected`. |
  | `is_active` | string | ➖ | Standart: faqat aktiv. `all` — o'chirilganlar ham; `false` — faqat o'chirilgan. |
  | `is_cancelled` | bool | ➖ | Standart: hammasi. `false` — bekor qilinmaganlar (picker shuni yuboradi); `true` — faqat bekor qilinganlar. |
  | `per-page` | int | ➖ | Sahifa hajmi (1–100, default 20). |

  ### 📤 Response

  `200` — `{ items: ContractOutputDTO[], pagination }`. Har element:

  | Field | Type | Description |
  |---|---|---|
  | `id` | int | Shartnoma ID |
  | `contract_type` | string | `vacancy` \| `yearly` |
  | `contract_type_label` | string | Tarjima qilingan tip nomi |
  | `party_a_organization` | object | `{ id, name, type }` — buyurtmachi tomon (type 1 = XBA, 7 = rekruter) |
  | `party_b_organization` | object | `{ id, name, type }` — jalb qilingan tomon (type 6 = ish beruvchi, 7 = rekruter) |
  | `candidate_count` | int \| null | Vacancy kvotasi; `yearly` da `null` |
  | `used_count` | int \| null | Band slotlar — shartnoma **istalgan zanjir bo'g'inida** ishlatilgan vakansiyalar soni; `yearly` da `null` |
  | `remaining` | int \| null | `candidate_count - used_count`; `yearly` da `null` |
  | `start_date` | string \| null | Yearly boshlanish sanasi `d.m.Y`; `vacancy` da `null` |
  | `file` | object \| null | Shartnoma hujjati (`UploadFileOutputDTO`) |
  | `is_active` | bool | `false` = soft-delete qilingan |
  | `approval_status` | string | `pending` \| `approved` \| `rejected` |
  | `approval_status_label` | string | Tarjima qilingan holat nomi |
  | `rejection_reason` | string \| null | Rad sababi; aks holda `null` |
  | `approved_at` | string \| null | Ko'rib chiqilgan sana `d.m.Y`; `null` = hali ko'rilmagan |
  | `is_cancelled` | bool | Bekor qilinganmi |
  | `cancelled_at` | string \| null | Bekor qilingan sana `d.m.Y`; `null` = bekor qilinmagan |
  | `cancellation_reason` | string \| null | Bekor sababi; aks holda `null` |
  | `is_effective` | bool | `approved` va bekor qilinmagan — tanlanadigan; bog'langan vakansiya tasdiqlanishi mumkin |
  | `uploaded_at` | string | Yuklangan sana `d.m.Y` (`created_at`) |
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
