info:
  name: Driver License Categories — Index
  type: http
  seq: 40
http:
  method: GET
  url: '{{base_url}}/admin/driver-license-categories'
  auth: inherit
params: {}
docs: >
  Haydovchilik guvohnomasi kategoriyalari ro'yxati (enum'dan) — leadlar Filter
  panelidagi "Haydovchilik guvohnomasi" tanlovi uchun.


  **Auth:** `access_token` (admin).


  ### 📤 Response (`data`)

  Massiv: `[{ value, label }]` — `A`, `B`, `C`, `D`, `E`, `BE`, `CE`, `DE`, `TM`, `TB`.
  `label` = kodning o'zi (kartada ham faqat kod chiqadi), tartib — guvohnoma
  kartasidagi tartib.


  > Mobil ekvivalenti: `GET mobile/driver-license-categories` — u qo'shimcha
  > `description` (toifa qanday transportni qamraydi) qaytaradi va tanlagichda
  > yordamchi matn sifatida ishlatiladi. Admin javobi o'zgarmagan.
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
