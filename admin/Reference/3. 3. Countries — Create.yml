info:
  name: 3. Countries — Create
  type: http
  seq: 3
http:
  method: POST
  url: '{{base_url}}/admin/countries'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: "{\n  \"name\": {\"uz\": \"Germaniya\", \"ru\": \"Германия\", \"en\": \"Germany\"},\n  \"iso_code\"\
      : \"DE\",\n  \"visa_regime\": \"visa\",\n  \"visa_difficulty_group\": 1,\n  \"is_active\": 1,\n\
      \  \"flag_id\": 10,\n  \"image_id\": 11\n}"
  auth: inherit
docs: 'Yangi davlat qo''shadi. `application/json` so''rov.


  **Auth:** `admin_token`.


  ### 📥 Request Body


  | Field | Type | Required | Description |

  |---|---|:---:|---|

  | `name` | object (JSON) | ✅ | `{"uz": "...", "ru": "...", "en": "..."}` |

  | `iso_code` | string | ✅ | 2 ta xarfli kod (masalan `DE`, `US`) |

  | `visa_regime` | string \| null | Davlatning O''zbekiston fuqarosi uchun viza rejimi: `visa` \| `visa_free`.
  `null` — aniqlanmagan, bu davlat uchun sug''urta polisi **ochilmaydi** |

  | `visa_difficulty_group` | int \| null | Viza olish qiyinligi: `1` (deyarli muammosiz) \| `2` (o''rta)
  \| `3` (qiyin). Rekruting tahlili uchun; sug''urta tarifiga aloqasi yo''q |

  | `is_active` | int (0\|1) | ➖ | Default: 0 |

  | `sort_order` | int | ➖ | Default: 0 |

  | `flag_id` | int | ➖ | `/admin/upload` orqali yuklangan bayroq fayl ID |

  | `image_id` | int | ➖ | `/admin/upload` orqali yuklangan rasm fayl ID |


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `422` | Validatsiya xatosi |

  | `400` | `flag_id` yoki `image_id` topilmadi yoki `status=uploading` |


  > **O''zgardi:** `is_visa_available` ustuni **o''chirildi** (240 qatorning hammasi `false` edi, ishlatilmasdi).

  > O''rniga `visa_regime` + `visa_difficulty_group`. `PATCH .../toggle-visa` endpointi ham olib tashlandi.

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
