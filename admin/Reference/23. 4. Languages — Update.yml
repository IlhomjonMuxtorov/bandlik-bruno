info:
  name: 23. 4. Languages — Update
  type: http
  seq: 23
http:
  method: POST
  url: '{{base_url}}/admin/languages/1'
  body:
    type: multipartForm
    data:
    - name: name
      value: '{"uz": "O''zbek (yangilandi)", "ru": "Узбекский (обновлено)", "en": "Uzbek
        (updated)"}'
    - name: iso_code
      value: uz
    - name: scale
      value: cefr
    - name: is_active
      value: '1'
    - name: sort_order
      value: '1'
  auth: inherit
docs: 'Til ma''lumotlarini yangilash (qisman update).


  > **Yangi (2026-09):** `scale` — tilning **standart** shkalasi. O''zgartirilsa, `language_scale`
  pivot''dagi `is_default` bayrog''i shu shkalaga ko''chadi (agar hali biriktirilmagan
  bo''lsa — avtomatik biriktiriladi). Qo''shimcha shkalalar (nostandart) bu endpoint orqali
  emas, `POST/DELETE /admin/languages/{id}/scales*` bilan boshqariladi.


  **Auth:** `admin_token`.


  ### 📥 Request Body (multipart/form-data)


  | Field | Type | Required | Description |

  |---|---|:---:|---|

  | `name` | object (JSON) | ➖ | `{"uz": "...", "ru": "...", "en": "..."}` |

  | `iso_code` | string (max 5) | ➖ | Unikal ISO kod |

  | `scale` | string | ➖ | Tilning **standart** shkalasi (23 tadan biri — to''liq
  ro''yxat: `GET /admin/proficiency-scales`). |

  | `is_active` | int (0\|1) | ➖ | |

  | `sort_order` | int | ➖ | |


  ### 📤 Response


  Yangilangan til — «Languages — View» bilan bir xil shakl.

  '
