http:
  method: GET
  url: '{{base_url}}/admin/languages'
  auth: inherit
docs: 'Tillar ro''yxati (paginatsiya bilan).


  > Ro''yxat `Accept-Language` bo''yicha alifbo (A-Z) tartibida qaytadi (fallback
  `uz`) — `sort_order` emas, agar `sort` yuborilmagan bo''lsa.


  > **Yangi (2026-09):** `language.scale` 1:1 dan **`language_scale` pivot** (1:N) ga
  o''tdi — bir tilga bir nechta shkala biriktirilishi mumkin (masalan ingliz tili: CEFR,
  IELTS, TOEFL iBT, TOEFL ITP, Linguaskill). `scale` ustuni **standart (default)** shkalani
  ko''rsatadi va saqlanib qoldi; har bir elementga qo''shilgan yangi `scales[]` massivi
  **barcha** biriktirilgan shkalalarni, har biri o''z darajalari bilan qaytaradi. Qo''shimcha
  shkalalarni boshqarish uchun `GET/POST/DELETE /admin/languages/{id}/scales*` endpointlariga
  qarang.


  **Auth:** `admin_token`.


  ### 🔎 Query Parameters


  | Param | Type | Required | Description |

  |---|---|:---:|---|

  | `q` | string | ➖ | Nom bo''yicha qidiruv (JSONB `name` bo''yicha `ILIKE`). |

  | `is_active` | int (0\|1) | ➖ | Faolligi bo''yicha filtr. |

  | `page` | int | ➖ | Sahifa raqami (default `1`). |

  | `per-page` | int | ➖ | Sahifa hajmi (1–300, default `20`). |

  | `sort` | string | ➖ | Berilmasa — A-Z. `sort_order` — eski tahririy tartib.
  Ruxsat etilgan: `id` \| `-id` \| `sort_order` \| `-sort_order` \| `created_at` \|
  `-created_at`. |


  ### 📋 Headers


  | Header | Required | Description |

  |---|:---:|---|

  | `Authorization` | ✅ | `Bearer {{ _.admin_token }}` |

  | `Accept-Language` | ➖ | `uz` \| `ru` \| `en`. Default: `uz`. |


  ### 📤 Response (`data.items[]`)


  | Field | Type | Description |

  |---|---|---|

  | `id` | int | |

  | `name` | object | Tahrirlash uchun xom i18n: `{ uz, ru, en }`. |

  | `name_localized` | string | `Accept-Language` bo''yicha tarjima (fallback `uz`).
  |

  | `iso_code` | string | ISO kod (masalan `uz`, `ru`, `en`) |

  | `scale` | string | Tilning **standart** daraja shkalasi (23 tadan biri: `cefr` \|
  `ielts` \| `toefl_ibt` \| `toefl_itp` \| `linguaskill` \| `delf` \| `tcf` \| `goethe`
  \| `hsk` \| `topik` \| `jlpt` \| `testdaf` \| `torfl` \| `ilr` \| `actfl` \| `clb` \|
  `nclc` \| `tocfl` \| `stanag` \| `oet` \| `dsh` \| `nt2` \| `eiken`). To''liq ro''yxat:
  `GET /admin/proficiency-scales`. |

  | `is_active` | bool | |

  | `sort_order` | int | |

  | `levels` | array | Tilning **standart** shkalasi darajalari (read-only, o''zgarmadi —
  eski client''lar uchun), scale tartibida: `[{ id, code, name: { uz, ru, en }, name_localized,
  is_active, score_min, score_max }]` — masalan `jlpt` uchun `N5..N1`. |

  | `scales` | array | **Yangi.** Shu tilga biriktirilgan barcha shkalalar, `sort_order`
  bo''yicha: `[{ scale, label, is_default, is_active, sort_order, is_exam, levels[] }]`
  — quyidagi jadvalga qarang. |


  #### `scales[]` elementi


  | Field | Type | Description |

  |---|---|---|

  | `scale` | string | Shkala kodi: `cefr` \| `ielts` \| … |

  | `label` | string | Lokalizatsiyalangan nom, masalan «IELTS (ingliz tili)» |

  | `is_default` | bool | `true` — tilning standart shkalasi (`scale` ustuniga teng, `language.scale`
  bilan sinxron) |

  | `is_active` | bool | `false` — pikerlarda ko''rinmaydi, lekin mavjud yozuvlar hamon
  ishlaydi |

  | `sort_order` | int | Ko''rsatish tartibi |

  | `is_exam` | bool | `true` — yagona imtihon shkalasi (IELTS, JLPT…), `false` — umumiy
  freymvork/reyting tizimi (CEFR, ILR, ACTFL, CLB, NCLC, STANAG) |

  | `levels` | array | Shu shkalaning darajalari: `[{ id, code, name: { uz, ru, en },
  name_localized, is_active, score_min, score_max }]` |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
