info:
  name: 22. 3. Languages — Create
  type: http
  seq: 22
http:
  method: POST
  url: '{{base_url}}/admin/languages'
  body:
    type: multipartForm
    data:
    - name: name
      value: '{"uz": "Fransuz", "ru": "Французский", "en": "French"}'
    - name: iso_code
      value: fr
    - name: scale
      value: cefr
    - name: is_active
      value: '1'
    - name: sort_order
      value: '11'
  auth: inherit
docs: 'Yangi til qo''shadi.


  > **Yangi (2026-09):** `scale` endi tilning **standart** shkalasini bildiradi.
  Saqlanganda backend avtomatik ravishda `language_scale` pivot''ga shu shkalani
  `is_default=true` bilan yozadi — til yaratilgandan so''ng darhol ishlatishga tayyor
  bo''ladi. Qo''shimcha shkalalarni keyin `POST /admin/languages/{id}/scales` bilan
  biriktiring.


  **Auth:** `admin_token`.


  ### 📥 Request Body (multipart/form-data)


  | Field | Type | Required | Description |

  |---|---|:---:|---|

  | `name` | object (JSON) | ✅ | `{"uz": "...", "ru": "...", "en": "..."}` |

  | `iso_code` | string (max 5) | ✅ | Unikal ISO kod (masalan `fr`) |

  | `scale` | string | ➖ | Tilning **standart** shkalasi (23 tadan biri: `cefr` \|
  `ielts` \| `toefl_ibt` \| `toefl_itp` \| `linguaskill` \| `delf` \| `tcf` \| `goethe`
  \| `hsk` \| `topik` \| `jlpt` \| `testdaf` \| `torfl` \| `ilr` \| `actfl` \| `clb`
  \| `nclc` \| `tocfl` \| `stanag` \| `oet` \| `dsh` \| `nt2` \| `eiken`). Default:
  `cefr`. To''liq ro''yxat: `GET /admin/proficiency-scales`. |

  | `is_active` | int (0\|1) | ➖ | Default: 1 |

  | `sort_order` | int | ➖ | Default: 0 |


  ### 📤 Response


  Yaratilgan til — «Languages — View» bilan bir xil shakl (`scales[]` ichida faqat
  yuqoridagi standart shkala, `is_default=true`).

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
