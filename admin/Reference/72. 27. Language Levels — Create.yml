http:
  method: POST
  url: '{{base_url}}/admin/language-levels'
  headers:
  - name: Content-Type
    value: application/json
  - name: Accept-Language
    value: uz
  body:
    type: json
    data: "{\n  \"code\": \"ielts_6_5\",\n  \"name\": {\"uz\": \"6.5 — Yaxshi+\", \"ru\"\
      : \"6.5 — Хорошо+\", \"en\": \"6.5 — Competent+\"},\n  \"scale\": \"ielts\",\n\
      \  \"sort_order\": 12,\n  \"is_active\": 1,\n  \"score_min\": null,\n  \"score_max\"\
