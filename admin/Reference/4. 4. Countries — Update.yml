info:
  name: 4. Countries — Update
  type: http
  seq: 4
http:
  method: POST
  url: '{{base_url}}/admin/countries/1'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: "{\n  \"name\": {\"uz\": \"Turkiya\", \"ru\": \"Турция\", \"en\": \"Turkey\"},\n  \"visa_regime\"\
      : \"visa_free\",\n  \"visa_difficulty_group\": 2\n}"
  auth: inherit
docs: 'Davlatni yangilaydi. `application/json` — faqat o''zgaradigan maydonlarni yuborish kifoya.


  Fayl maydonlari: `flag_id`, `image_id` (oldindan `/admin/upload` orqali yuklangan fayl ID).


  **Auth:** `admin_token`.


  > **O''zgardi:** `is_visa_available` ustuni **o''chirildi** (240 qatorning hammasi `false` edi, ishlatilmasdi).

  > O''rniga `visa_regime` + `visa_difficulty_group`. `PATCH .../toggle-visa` endpointi ham olib tashlandi.

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
