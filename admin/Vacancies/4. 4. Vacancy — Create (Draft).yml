docs: |
  Yangi vakansiya yaratadi — boshlanishi `status = draft`. Wizardning barcha 8 bosqich
  ma'lumotlari bitta tranzaksiyada saqlanadi.

  **Auth:** `admin_token` yoki Employer/Recruiter (faqat o'z tashkiloti uchun).

  ### 📥 Request Body

  ### 🔗 `contract_chain` — shartnoma zanjiri

  XBA ish beruvchi bilan **yo to'g'ridan-to'g'ri**, **yo rekruter(lar) orqali**
  ishlaydi. Zanjir shu yo'lni yozadi; har bir bo'g'in o'z ikki tomoni o'rtasidagi
  shartnomani olib yuradi.

  ```
  XBA ↔ ish beruvchi                                  → 1 ta bo'g'in (oraga rekruter qo'shib bo'lmaydi)
  XBA ↔ rekruter1 ↔ rekruter2 ↔ ish beruvchi          → 3 ta bo'g'in
  ```

  | Field | Type | Required | Description |
  |---|---|:---:|---|
  | `to_organization_id` | int | ✅ | Bo'g'in yakuniy tomoni: `RECRUITER` (7) yoki `EMPLOYER` (6). Picker: `GET /admin/vacancies/organizations?type=recruiter\|employer`. |
  | `contract_id` | int \| null | ➖ | Shu bo'g'inning ikki tomoni o'rtasidagi shartnoma. Draft'da `null` bo'lishi mumkin; `submit`da majburiy. Picker: `GET /admin/contracts?party_a_organization_id={bo'g'in boshi}&party_b_organization_id={to_organization_id}&is_cancelled=false`. |

  > Bo'g'inning **boshlanish tomoni yuborilmaydi** — server hisoblaydi: 0-bo'g'inda
  > `organization_id` (XBA), keyingilarida oldingi bo'g'inning `to_organization_id`.

  **Qoidalar (buzilsa `400`):**

  | Qoida | Xabar |
  |---|---|
  | `EMPLOYER` faqat oxirgi bo'g'inda va bittadan ko'p emas | `The employer must be the last link of the contract chain` |
  | Bir tashkilot zanjirda bir marta | `An organization may appear only once in the contract chain` |
  | Ko'pi bilan 5 ta bo'g'in | `A contract chain may not exceed 5 links` |
  | Shartnoma bo'g'inning aynan ikki tomoni o'rtasida | `Contract is not signed between the two parties of this chain link` |
  | `vacancy`-tip shartnoma kvotasi (`candidate_count`) — zanjirning istalgan bo'g'inida band slot hisoblanadi | `Contract candidate quota is full` |

  > **Draft erkin, submit qat'iy.** Draft holatida zanjir bo'sh ham, yarim
  > to'ldirilgan ham (shartnomasiz bo'g'in, ish beruvchiga yetmagan zanjir)
  > bo'lishi mumkin. `submit` esa har bo'g'inda shartnoma bo'lishini **va** zanjir
  > ish beruvchi bilan tugashini talab qiladi (`400`).
  >
  > Tasdiqlanmagan (`pending`/`rejected`) shartnoma **tanlanishi mumkin**, ammo
  > vakansiya biriktirilgan shartnomalarning har biri `approved` (va bekor
  > qilinmagan) bo'lmaguncha tasdiqlanmaydi. Shartnomasiz bo'g'in approve'ni
  > bloklamaydi — u submit'da ushlangan.

  **Asosiy maydonlar (1-bosqich):**

  | Field | Type | Required | Description |
  |---|---|:---:|---|
  | `organization_id` | int | ✅ | **XBA** tashkiloti (boshqaruvchi agentlik). Faqat `XBA`-type org qabul qilinadi — aks holda `422`. |
  | `contract_chain` | array | ➖ | **Shartnoma zanjiri** ("Ish beruvchi / Rekruter tanlash"), bo'g'in tartibida. Draft'da bo'sh (`[]`) bo'lishi mumkin; `submit`da to'liq bo'lishi shart. Pastdagi alohida bo'limga qarang. |
  | `recruiter_id` | int | ➖ | **Deprecated** — eski (zanjirdan oldingi) shakl. `contract_chain` yuborilmasa, `recruiter_id` (+ ixtiyoriy `contract_id`) bitta bo'g'inli zanjirga aylantiriladi. Javobda esa bu maydon doim zanjirning **0-bo'g'ini** (XBA ning to'g'ridan-to'g'ri kontragenti) bo'lib qaytadi. |
  | `contract_id` | int | ➖ | **Deprecated** — 0-bo'g'in shartnomasining mirror'i. Yangi klientlar shartnomani `contract_chain[].contract_id` ichida yuboradi. |
  | `industry_id` | int | ➖ | Soha ID |
  | `title` | string | ✅ | Sarlavha |
  | `description` | string | ➖ | Tavsif (HTML/markdown) |
  | `experience_months` | int | ➖ | Talab qilinadigan ish tajribasi (oylarda). `0` = tajriba talab qilinmaydi. Default: `0`. |
  | `employment_type` | string | ✅ | `full_time` \| `part_time` \| `seasonal` \| `contract` |
  | `hiring_quota` | int | ✅ | Necha kishi kerak (>=1) |
  | `duration_months_min` / `_max` | int | ➖ | Ish davomiyligi |
  | `work_schedule` | string | ➖ | `5_2` \| `6_1` \| `2_2` \| `shift` \| `flexible` |
  | `work_time_from` / `_to` | string | ➖ | `HH:MM` |
  | `salary_gross` / `_currency` | int / string | ➖ | Maosh (tavsifiy) — **major unitda** (o'z valyutasida; client uchun o'zgarish yo'q). Valyuta: `UZS` \| `USD` \| `EUR` \| `RUB` \| `GBP` \| `KRW` \| `JPY` \| `TRY` \| `AED` \| `SAR` \| `KZT` \| `PLN` \| `QAR` \| `KWD` (boshqasi → `422`). To'liq ro'yxat: `GET /admin/vacancies/salary-currencies`. Default `UZS`. Xizmat narxlari valyutasiga ta'sir qilmaydi — ular `UZS`-da qoladi. |
  | `salary_net` / `_currency` | int / string | ➖ | **Major unitda** (o'z valyutasida). Valyuta: yuqoridagi bilan bir xil ro'yxat. |
  | `country_id` | int | ✅ | |
  | `city_id` | int | ➖ | |
  | `address` | string | ➖ | Manzil (1-qator) — max 500 |
  | `address2` | string | ➖ | Manzil (2-qator) — kvartira / ofis va h.k. (max 500) |
  | `state` | string | ➖ | Shtat / viloyat / o'lka nomi (max 150) |
  | `postal_code` | string | ➖ | Pochta indeksi (max 30) |
  | `hide_address_from_clients` | bool | ➖ | Default `false`. `true` bo'lsa barcha manzil maydonlari (`address`, `address2`, `state`, `postal_code`) nomzodga ko'rsatilmaydi |
  | `deadline_at` | string | ➖ | `DD.MM.YYYY`. O'tmishdagi (orqa) sana bo'lmasligi kerak — bugun ruxsat, kechagi va undan oldingi sana → `422`. |

  **Child kolleksiyalar:**

  | Field | Type | Description |
  |---|---|---|
  | `requirements[]` | array | **Tiplangan talablar.** Har element: `{id, sort_order, is_mandatory?, …value}`. `id` — `vacancy_requirement` (definition) IDsi; qiymat maydoni definition `value_type`iga bog'liq: `integer_range` → `value_int_min`+`value_int_max`; `integer` → `value_int_min`; `boolean` → `value_bool`; `level` → `value_level_id`; `single_select`/`multi_select`/`reference_single`/`reference_multi` → `value_refs` (kod/id massiv); `text` → `value_text` (`{uz,ru,en}`). `is_mandatory` (bool, ➖, default `true`) — majburiy/afzal. Pickable definition'lar: `GET /admin/vacancies/requirement-definitions?industry_category_id=…`; tanlovlar: `GET /admin/vacancies/requirement-options/{id}` |
  | `language_requirements[]` | array | **Til talablari** (alohida). Har element: `{language_id, min_language_level_id, is_mandatory?, certificate_type?, certificate_min_score?, sort_order?}`. `min_language_level_id` — `language_level` (CEFR/HSK/TOPIK shkalasi). `certificate_type` — `ielts`\|`toefl`\|`delf`\|`goethe`\|`hsk`\|`topik` (➖). `certificate_min_score` — string, masalan `6.5`/`B2`/`HSK5` (➖) |
  | `benefits[]` | array | **Tiplangan imtiyozlar.** Har element: `{id, sort_order, …value}`. `id` — `vacancy_benefit` (definition) IDsi; qiymat maydoni definition `value_type`iga bog'liq: `boolean` → `value_bool`; `percent` → `value_min` (0–100); `percent_range` → `value_min`+`value_max`; `days` → `value_min`; `percent_or_money` → `mode` (`percent`\|`money`) + (`percent` → `value_min` \| `money` → `amount`+`currency`); `money` → `amount`+`currency`. `amount` — major birlik (so'm/dollar); `is_free` (bool, ➖) — to'liq bepul (faqat `percent`/`percent_range`). **1-guruh (`salary.*`) money rejimida `currency` vakansiya gross/net valyutasiga teng bo'lishi shart.** Pickable definition'lar: `GET /admin/vacancies/benefit-definitions?q=…`; tanlovlar: `GET /admin/vacancies/benefit-options/{id}` |
  | `documents[]` | array | `{id, sort_order}` — vacancy_document katalog IDsi |
  | `service_groups[]` | array | **Xizmatlar TASHKILOT guruhlari bo'yicha (majburiy).** Har bir guruh: `{organization_id, payment_deadline_days, execution_deadline_days, sort_order, services:[…]}`. Bitta tashkilot = bitta guruh; guruh bir nechta kategoriyani qamrashi mumkin (masalan notarius tashkilotning `notary_translation` + `notary_apostille` + `notary_other` xizmatlari bitta guruhda). `organization_id` faqat guruhda — nested xizmatlar undan meros oladi. Ikkala muddat (kunlarda) > 0. `payment_deadline_days` — kandidatning to'lash muddati (guruh boshlangandan); `execution_deadline_days` — bajarish muddati (to'langandan). **Tartib:** saqlashda qayta tartiblanadi — reorderable guruhlar (course/insurance/notarius) boshida (yuborilgan `sort_order` bo'yicha), fixed guruhlar (visa→agency→logistics) oxirida (qat'iy). Guruhning turi uning xizmatlari kategoriyasidan aniqlanadi |
  | `service_groups[].services[]` | array | Guruhning xizmatlari: `{category, organization_service_id?, educational_course_id?, notary_*_price_id?, insurance_country_price_id?, price?, currency?, service_name?, duration_text?, notes?, sort_order?}`. Har xizmat o'z `category` siga ega (bir kategoriya faqat bitta tashkilotda bo'lishi mumkin). `educational_course_id` `category="training"` da majburiy. Vakansiya darajasida `training` xizmati + kurs talabi esa **shartli** — `app_setting.vacancy_training_course_required` toggle'iga bog'liq (pastga qarang). `organization_service_id` berilsa narx/nom snapshot qilinadi (override `price`/`service_name` orqali). **Training kurslari uchun `price` override e'tiborga olinmaydi** — narx kursdan snapshot qilinadi (ADR 0005) |
  | `single_payment` | bool | `1 tada 100% lik to'lov` toggle. `false` bo'lsa to'lov rejasi `service_groups[]` ning o'zi — guruhlar ketma-ket (yuqoridagi tartibda) to'lanadi |

  > To'lov rejasi alohida yuborilmaydi — `service_groups[]` (har guruh o'z xizmat narxlari snapshot'i bilan) to'lov rejasining o'zidir. Eski `payment_steps[]` maydoni olib tashlangan; yuborilsa e'tiborga olinmaydi.

  > **Birlik (breaking):** `service_groups[].services[].price` override'i va `insurance_coverage_amount` endi **so'mda (major unit)** yuboriladi — avvalgi tiyin EMAS. Backend tiyinda saqlaydi; javobdagi `price`, `insurance_coverage_amount` va `total_service_amount` ham so'mda qaytadi. Admin frontend uchun breaking change.

  **⚠️ Agentlik xizmati (majburiy):** xizmatlar orasida **aniq bitta** `category = "agency"` xizmati bo'lishi shart, va uning guruhi (`organization_id`) vakansiyaning `organization_id` ga teng bo'lishi kerak; agentlik xizmatining `service_name` to'ldirilgan va `price > 0` bo'lishi zarur. Agentlik narxi `total_service_amount` ga kiritiladi.

  **⚠️ Kurs (shartli — `app_setting.vacancy_training_course_required`):**

  - Toggle **`false`** (joriy default — o'quv dasturi tayyor emas): kurs talab qilinmaydi. Vakansiya `training` guruhisiz yaratiladi — `service_groups[]` da `group_type = "training"` guruhini **umuman yubormaslik** mumkin. Pipeline shu guruhsiz quriladi (kurs qadami ham, kurs to'lov qadami ham yo'q).
  - Toggle **`true`**: har bir vakansiyada **kamida bitta** `category = "training"` xizmati bo'lishi va unga `educational_course_id` biriktirilgan bo'lishi shart — aks holda `400` `At least one training service with a course is required`; `training` guruhi butunlay yuborilmasa `400` `Service group "Training course" is required`.

  Joriy qiymatni `GET /admin/app-setting` → `vacancy_training_course_required` dan o'qing — wizard "O'quv kurslari" qadamini shu flagga qarab yashiring/majburiy qiling. `agency` (XBA) guruhi **har ikki holatda ham majburiy**.

  > Toggle `false` paytida ham `training` guruhi yuborilsa, uning ichidagi `training` xizmati baribir `educational_course_id` talab qiladi (kurssiz training xizmatining ma'nosi yo'q) — `400` `educational_course_id is required`. Kurs kerak bo'lmasa `training` guruhini butunlay yubormang.

  **⚠️ Kurslar narxi (ADR 0005):** eski yagona `combined_price` **bekor qilindi**. Training summasi = biriktirilgan kurslar snapshot narxlari **yig'indisi** (boshqa guruhlar kabi). Narx kursda belgilanadi, vakansiyada o'zgartirilmaydi (override yo'q). Kurs valyutasi vakansiya valyutasiga mos bo'lishi shart — aks holda `400` `Course currency must match the vacancy currency`.

  **🔖 Shablon sifatida saqlash (wizard checkboxi):** `save_as_template = true` (bool, ➖) yuborilsa, vakansiya yaratilgach shu wizard formasi `vacancy_template` sifatida ham saqlanadi — **xuddi shu tranzaksiyada** (shablon saqlash xato bo'lsa vakansiya ham yaratilmaydi). Shablon nomi `template_name` (string, ➖); berilmasa vakansiya `title`'i ishlatiladi (200 belgigacha qisqartiriladi). Shablon vakansiyaning `organization_id`'iga biriktiriladi va keyin `GET /admin/vacancy-templates` da ko'rinadi.

  ### 📤 Response (`data`)

  Full detail DTO (View bilan bir xil). `status` = `draft`, `total_service_amount` = **barcha** xizmatlar narxi yig'indisi (training kurslar ham per-service qo'shiladi) — **so'mda (major unit)**. `service_groups[]` nested `services[]` bilan, `sort_order` bo'yicha tartiblangan (reorderable oldinda, visa→agency→logistics oxirida) va har biri `is_reorderable` (bool) maydonini qaytaradi — FE shu flag bo'yicha sudraladigan/qulflangan elementlarni ajratadi. (`combined_price` maydoni olib tashlandi — ADR 0005.)

  **`auto_approval`** (object) — vakansiya keyin avtomatik chop etilishi haqida ma'lumot (FE "submit'dan keyin N daqiqada avto-chop etiladi" deb ko'rsatishi uchun):

  | Field | Type | Description |
  |---|---|---|
  | `enabled` | bool | Global avto-tasdiq yoqilganmi (`AppSetting`) |
  | `window_minutes` | int | Standart kutish oynasi (daqiqa). Default `180` (3 soat) |
  | `eligible` | bool | XBA org ishonchlimi (`organization.auto_approve_vacancies`) — birinchi vakansiya qo'lda tasdiqlangach `true` bo'ladi |
  | `estimated_publish_at` | int \| null | Avto-chop etilish vaqti (unix). **Faqat** `enabled && eligible && status=pending_approval` bo'lganda qiymat; create'da (draft) `null`, chunki hali submit qilinmagan |
  | `estimated_publish_at_formatted` | string \| null | `DD.MM.YYYY HH:MM` yoki `null` |

  > Create javobida vakansiya hali `draft` — shu sabab `estimated_publish_at` `null`. Aniq vaqt **Submit** javobida (pending_approval) qaytadi.

  ### ⚠️ Errors

  | Code | Reason |
  |---|---|
  | `400` | Zanjir qoidasi buzilgan (yuqoridagi `contract_chain` jadvaliga qarang) |
  | `422` | Validatsiya xatosi. Jumladan: `organization_id` XBA-type emas; `deadline_at` o'tmishdagi (orqa) sana — `Deadline cannot be in the past` |
  | `400` | Snapshot xatosi (Organization service topilmadi / boshqa tashkilotga tegishli); `agency` xizmati yo'q yoki narxi 0; **kurs yo'q** — `training` xizmati yoki uning `educational_course_id` si yo'q (faqat `vacancy_training_course_required = true` bo'lganda); **service_groups** xatosi (tashkilot takrorlangan, bir kategoriya ikki tashkilotda, organization yo'q, muddat 0/yo'q, yoki guruhda xizmat yo'q) |
  | `403` | Non-admin: aktyorning org'i na `organization_id` (XBA), na zanjirdagi biror tomon bo'lmasa |
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
