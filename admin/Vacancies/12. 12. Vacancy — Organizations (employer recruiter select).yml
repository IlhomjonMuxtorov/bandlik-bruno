info:
  name: 12. Vacancy — Organizations (employer - recruiter select)
  type: http
  seq: 12
http:
  method: GET
  url: '{{base_url}}/admin/vacancies/organizations?q=&type='
  params:
  - name: q
    value: ''
    type: query
    enabled: true
  - name: type
    value: ''
    type: query
    enabled: false
  headers:
  - name: Accept-Language
    value: uz
  auth: inherit
docs: 'Vakansiya yaratishdagi **shartnoma zanjiri** ("Ish beruvchi / Rekruter
  tanlash") pickerlari uchun ro''yxat. Faqat aktiv (`is_active = true`) Employer
  (`type=6`) va Recruiter (`type=7`) tashkilotlari qaytariladi.


  **Eslatma:** tanlangan `id` vacancy payload''idagi
  `contract_chain[].to_organization_id` ga yuboriladi (`organization_id` — XBA
  tashkiloti id''si, alohida o''rnatiladi). "Rekruter qo''shish" tugmasi
  `?type=recruiter`, "Ish beruvchi qo''shish" `?type=employer` bilan chaqiradi —
  ish beruvchi faqat zanjirning oxirgi bo''g''ini bo''la oladi.


  > Ro''yxat **default** tashkilot nomi bo''yicha alifbo (A-Z) tartibida qaytadi,
  agar `sort` yuborilmagan bo''lsa.


  **Auth:** `admin_token` yoki org foydalanuvchi.


  ### 🔎 Query Parameters


  | Param | Type | Required | Description |

  |---|---|:---:|---|

  | `q` | string | ➖ | Nom / brend bo''yicha qidiruv (`name`, `brand_name` ILIKE). |

  | `type` | string | ➖ | `employer` \| `recruiter`. Berilmasa — ikkalasi (eski
  xatti-harakat). |

  | `page` | int | ➖ | Sahifa raqami (default `1`). |

  | `per-page` | int | ➖ | 1..100, default 20. |

  | `sort` | string | ➖ | Berilmasa — A-Z (`name`). Ruxsat etilgan: `id` \| `-id`
  \| `name` \| `-name`. |


  ### 📋 Headers


  | Header | Required | Description |

  |---|:---:|---|

  | `Authorization` | ✅ | `Bearer {token}` |

  | `Accept-Language` | ➖ | `uz` \| `ru` \| `en` |


  ### 📤 Response (`data`)


  | Field | Type | Description |

  |---|---|---|

  | `items` | array | Tashkilotlar ro''yxati |

  | `items[].id` | int | Tashkilot ID |

  | `items[].type` | int | `6` = Employer, `7` = Recruiter |

  | `items[].type_label` | string | `Ish beruvchi` \| `Rekruter` |

  | `items[].name` | string | Tashkilot nomi |

  | `items[].brand_name` | string \| null | Brend nomi |

  | `pagination` | object | `{ page, page_size, total_count, page_count }` |


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `401` | Token yo''q |

  | `403` | Ruxsat yo''q |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
