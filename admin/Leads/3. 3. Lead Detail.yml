info:
  name: 3. Lead Detail
  type: http
  seq: 3
http:
  method: GET
  url: '{{base_url}}/admin/leads/1'
  auth: inherit
params: {}
headers:
  - name: Accept-Language
    value: uz
    enabled: true
docs: >
  Bitta lead (foydalanuvchi) to'liq profili — "Foydalanuvchi" detal sahifasi.
  `id` = **user id**.


  > Soft-deleted (tombstone) leadlar ham ochiladi (ilgari `404` qaytar edi) — admin
  > ketgan nomzod profili + arizalarini ko'ra oladi.


  Profil mobil CV profili bilan bir xil shaklda (`CvOutputDTO`). Lead'da primary CV
  bo'lsa — to'liq profil; CV bo'lmasa ("Yangi") — minimal profil: shaxsiy/pasport/
  manzil + candidate-owned bo'limlar (oila, tillar, vizalar, haydovchilik), CV-scoped
  bo'limlar (`education`, `experience`, `documents`, `courses`) bo'sh massiv.


  **Auth:** `access_token` (admin).


  ### 📋 Headers


  | Header | Required | Description |

  |---|:---:|---|

  | `Accept-Language` | ➖ | `uz` \| `ru` \| `en`. Default `uz` |


  ### 📤 Response (`data`)


  | Field | Type | Description |

  |---|---|---|

  | `lead` | object | `{id, candidate_id, full_name, phone, photo_url, funnel_status, funnel_status_label, source, source_label, created_at, created_at_formatted}` |

  | `profile` | object \| null | `CvOutputDTO` shakli: `header, personal, birth_place, passport, registration, education[], experience[], family, languages[], documents[], driver, courses[], visas[], contact`. Candidate yo'q bo'lsa `null` |
  | `profile.registration` | object | Yashash manzili (MVD `MVDAddressInfoService`). Yuqori darajada **joriy** manzil — faol vaqtinchalik ro'yxat, aks holda doimiy propiska: `{ type, country, region, district, mahalla, street, street_type, address, cadastre, postal_code, registration_date, valid_until, full_address, permanent, temporary[] }`. To'liq ta'rif: `Vacancy Candidates Pipeline → 5. Candidate Profile` |
  | `profile.driver` | object | Haydovchilik guvohnomasi: `{ has_license, categories, categories_detail[], license_number, issue_date, expiry_date, source, certificates[] }`. `categories_detail` — har toifa uchun alohida sana/izoh (karta 10/11/12 maydonlari); `categories` CSV shu satrlarning proyeksiyasi. To'liq ta'rif: `Vacancy Candidates Pipeline → 5. Candidate Profile` |


  > **Maxfiylik — PINFL mask.** `profile.personal.pinpp` (JSHSHIR) admin/xodim
  > javoblarida **maskalanadi** — faqat oxirgi 4 raqam ko'rinadi (masalan
  > `**********1234`). To'liq PINFL'ni faqat nomzodning o'zi mobil ilovada ko'radi;
  > superadmin ham to'liq qiymatni ko'ra olmaydi.


  > **BREAKING:** `profile.birth_place` endi qat'iy MVD-derived: `{ address, country }`.
  > Eski `region`/`district` kalitlari OLIB TASHLANDI — MVD ularni ajratmaydi. `address`
  > kaliti QOLADI, lekin qiymati boshqa manbadan: endi MVD `birthplace` erkin matni
  > (masalan tuman nomi), avvalgi "nomzod kiritgan ko'cha/uy manzili" EMAS (`null` —
  > MVD topilmagan); `country` — tug'ilgan davlat, `country.gcp_code` orqali
  > lokalizatsiya, bo'lmasa xom MVD qiymati (`null` — noma'lum).
  >
  > `profile.passport.citizenship` (yangi) — `{ id, name }`. `id` — GCP davlat kodi
  > (`country.gcp_code`); `null` — MVD kod bermagan yoki davlat mos kelmagan. `name` —
  > `country` relation orqali lokalizatsiya, bo'lmasa xom MVD fuqarolik qiymati.
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
