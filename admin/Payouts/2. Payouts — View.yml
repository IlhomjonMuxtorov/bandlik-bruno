info:
  name: 2. Payouts — View
  type: http
  seq: 2
http:
  method: GET
  url: '{{base_url}}/admin/payouts/17'
  auth: inherit
docs: |
  Bitta payout so'rovi haqida to'liq ma'lumot — bank rekvizitlari (`bank_details`)
  bilan birga.

  **Auth:** `admin_token`.

  ### 📤 Response

  PayoutRequest DTO. `amount` — **so'm**da (valyutaga mos major unit; DB tiyinda saqlaydi).

  Aloqabank rail maydonlari:

  | Field | Type | Description |
  |---|---|---|
  | `provider` | string \| null | `aloqabank` yoki `null` (admin bankda qo'lda o'tkazadi). |
  | `external_order_id` | string \| null | Bank `orderId`: `XBA-PO-{id}` (retry: `-r2`, `-r3`...). Hali yuborilmagan bo'lsa `null`. |
  | `external_status` | string \| null | Bankning oxirgi `payment_status`: `Введен` \| `Проведен` \| `Удален`. |
  | `external_error_code` | int \| null | Bankning oxirgi xato kodi; xato bo'lmasa `null`. |
  | `last_checked_at` | int \| null | Oxirgi holat so'rovi vaqti (unix); hech qachon so'ralmagan bo'lsa `null`. |
  | `service_group_id` | int \| null | Payout'ni yaratgan service group; qo'lda so'ralgan bo'lsa `null`. |

  ### ⚠️ Errors

  | Code | Reason |
  |---|---|
  | `401` | Token yo'q |
  | `403` | Admin emas |
  | `404` | Payout topilmadi |
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
