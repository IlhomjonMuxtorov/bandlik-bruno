info:
  name: 1. Payouts — Index
  type: http
  seq: 1
http:
  method: GET
  url: '{{base_url}}/admin/payouts?per-page=20&status=1'
  auth: inherit
docs: 'Barcha payout so''rovlari. Default tartib: `-id` (eng yangisi birinchi); Pending''larni
  ko''rish uchun `status=1` filtri ishlatiladi. `provider` bo''yicha filter yo''q.


  **Auth:** `admin_token`. Permission: `payoutView`.


  ### 🔎 Query Params


  | Param | Type | Description |

  |---|---|---|

  | `organization_id` | int | Tashkilot bo''yicha |

  | `status` | int | 1..6 (Pending, Approved, Rejected, Processing, Completed, Failed)
  |

  | `from` / `to` | int | created_at unix timestamp; faqat ikkalasi birga yuborilganda qo''llanadi |

  | `per-page` | int | 1..100 |

  | `sort` | string | `id`, `created_at`, `amount` |


  ### 📤 Response


  PayoutRequest DTO ro''yxati (V1 list bilan bir xil shape). `amount` — **so''m**da
  (valyutaga mos major unit; DB tiyinda saqlaydi).


  Aloqabank rail maydonlari (`provider`, `external_order_id`, `external_status`,
  `external_error_code`, `last_checked_at`, `service_group_id`) har elementda bor;
  ma''nosi View so''rovida. Capture''dan avtomatik yaratilgan payout''lar
  `provider=aloqabank`, `requested_by=null` bilan `Pending` holatda keladi.


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `401` | Token yo''q |

  | `403` | `payoutView` ruxsati yo''q |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
