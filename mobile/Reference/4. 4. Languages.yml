info:
  name: 4. Languages
  type: http
  seq: 4
http:
  method: GET
  url: '{{base_url}}/mobile/languages'
  headers:
  - name: Accept
    value: application/json
  auth: inherit
docs: 'Til ma''lumotnomasi. Tanlangan tilga ko''ra lokalizatsiya qilingan nomlar
  qaytariladi.


  > Ro''yxat `Accept-Language` bo''yicha alifbo (A-Z) tartibida qaytadi (fallback
  `uz`) — `sort_order` emas.


  > **Yangi (2026-09):** har bir tilga bir nechta daraja shkalasi biriktirilishi mumkin
  (masalan ingliz tili — CEFR, IELTS, TOEFL iBT, TOEFL ITP, Linguaskill). `scale` maydoni
  **standart (default)** shkala bo''lib qoladi — eski client''lar o''zgarishsiz ishlayveradi.
  Tilning **barcha** biriktirilgan shkalalarini ko''rish uchun yangi `scales[]` massiviga
  qarang.


  **Auth:** `access_token`.


  ### 📋 Headers


  | Header | Required | Description |

  |---|:---:|---|

  | `Authorization` | ✅ | `Bearer {access_token}` |


  ### 📤 Response *(massiv elementi)*


  | Field | Type | Description |

  |---|---|---|

  | `id` | int | Til ID |

  | `iso_code` | string | ISO 639-1 (`uz`, `ru`, `en`, …) |

  | `name` | string | Lokalizatsiyalangan nom |

  | `scale` | string | Tilning **standart** daraja shkalasi (`cefr` \| `ielts` \| `hsk`
  \| `jlpt` \| … 23 ta) — darajalarni `GET /mobile/language-levels?scale=` bilan filtrlash
  uchun. To''liq ro''yxat `scales[]` da. |

  | `scales` | array | Shu til sertifikatlanadigan **barcha** faol shkalalar, `sort_order`
  bo''yicha: `[{ scale, label, is_default }]`. Masalan ingliz tili uchun 5 ta element
  (`cefr`, `ielts`, `toefl_ibt`, `toefl_itp`, `linguaskill`). Faqat `is_default: true`
  bo''lgan element `scale` maydoniga teng keladi. |


  #### `scales[]` elementi


  | Field | Type | Description |

  |---|---|---|

  | `scale` | string | Shkala kodi: `cefr` \| `ielts` \| `toefl_ibt` \| `toefl_itp` \|
  `linguaskill` \| `delf` \| `tcf` \| `goethe` \| `hsk` \| `topik` \| `jlpt` \| `testdaf`
  \| … |

  | `label` | string | Lokalizatsiyalangan nom, masalan «IELTS (ingliz tili)» |

  | `is_default` | bool | `true` — shu til uchun standart shkala (`scale` maydoniga teng)
  |


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `401` | Token yo''q yoki muddati o''tgan |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
