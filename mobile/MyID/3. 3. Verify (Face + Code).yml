info:
  name: 3. Verify (Face + Code)
  type: http
  seq: 3
http:
  method: POST
  url: '{{base_url}}/mobile/my-id/verify'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: "{\n  \"session_id\": \"{{myid_session_id}}\",\n  \"image_base64\": \"<base64_jpeg_from_sdk>\"\
      ,\n  \"code\": \"sample_code_from_sdk_123456\",\n  \"device_id\": \"{{device_id}}\"\n}"
  auth:
    type: bearer
    token: '{{access_token}}'
docs: |
  MyID SDK qaytargan yuz rasmi va kodini yuboradi. **Chaqiruvchi kim ekaniga qarab ikki
  xil ishlaydi** — bu eng muhim nuqta:

  | Token | Ma'nosi | Natija |
  |---|---|---|
  | `guest_token` | **Kirish (login)** | Pasport bo'yicha hisob topiladi yoki yaratiladi, token juftligi qaytadi |
  | `access_token` | **Shaxs tasdiqlash** | Pasport **chaqiruvchining o'z hisobiga** bog'lanadi |

  > ⚠️ Ilgari bu endpoint chaqiruvchini butunlay e'tiborsiz qoldirar edi: telefon bilan
  > kirgan foydalanuvchi "Shaxsni tasdiqlash" bosganda pasport egasi bo'lgan **boshqa**
  > hisobga tushib qolar, o'z hisobi tashlandiq qolardi. Endi bunday emas.

  **Auth:** `access_token` (tasdiqlash) yoki `guest_token` (kirish).

  ### 📥 Request Body

  | Field | Type | Required | Description |
  |---|---|:---:|---|
  | `session_id` | string | ✅ | `start-primary` / `start-secondary` qaytargan sessiya id (36 belgi). |
  | `image_base64` | string | ✅ | SDK olgan yuz rasmi, base64 JPEG (min 100 belgi). |
  | `code` | string | ✅ | SDK qaytargan tasdiqlash kodi. |
  | `device_id` | string | ✅ | Qurilma UUID'si — token juftligi shu qurilmaga bog'lanadi. |

  ### 📤 Response — `access_token` bilan (tasdiqlash)

  | Field | Type | Description |
  |---|---|---|
  | `access_token` | string | Yangilangan token (chaqiruvchi allaqachon kirgan, zararsiz). |
  | `refresh_token` | string | — |
  | `expires_in` | int | — |
  | `token_type` | string | `Bearer` |
  | `is_verified` | bool | `true` — MVD pasportni tasdiqladi, CV yaratish ochildi. |
  | `mvd_pending` | bool | `true` — yuz mos keldi, lekin MVD **vaqtincha** javob bermadi. Hisob **tasdiqlanmagan** holatda qoladi va CV hali ham yaratilmaydi. `POST /mobile/my-id/retry-mvd` bilan qayta uriniladi. |
  | `mvd_failure` | string \| null | MVD nima uchun tasdiqlamagani. Bu yerda faqat `unavailable` (vaqtincha ishlamayapti) bo'lishi mumkin — `blocked` / `not_found` `400` bo'lib qaytadi, chunki ular qaytarib bo'lmaydigan rad javobi. `null` — tasdiqlangan. |

  > **`mvd_pending` yagona "kutish" signali.** Ilova retry tugmasini **faqat**
  > `mvd_pending: true` bo'lganda ko'rsatishi kerak. Ilgari barcha MVD xatoliklari
  > (jumladan HTTP `423` — OneID ruxsati yo'q) `mvd_pending` bo'lib qaytar edi va
  > foydalanuvchi hech qachon muvaffaqiyat kelmaydigan retry'ni cheksiz bosardi.

  ### 📤 Response — `guest_token` bilan (kirish)

  `verify-phone` bilan bir xil: `{ access_token, refresh_token, expires_in, token_type }`.

  ### ⚠️ Errors

  | Code | Reason |
  |---|---|
  | `400` | `Face verification failed. Liveness score too low (< 0.6).` |
  | `400` | `This verification did not return passport data. Please verify with MyID again.` — secondary (reuid) sessiya ishlatilgan: u profil qaytarmaydi, ya'ni pasport ham, tug'ilgan sana ham yo'q, MVD'dan hech nima so'rab bo'lmaydi. |
  | `400` | `Invalid passport data returned from MyID.` |
  | `400` | `Failed to save verification data.` |
  | `400` | `mvd_failure: "blocked"` — MVD `423` qaytardi: pasport ma'lumotlari OneID orqali berilmagan. Xabar: *"Passport ma'lumotlari to'g'riligini va OneID tizimidan NextBrain uchun ruxsat berganingizni tekshiring"*. Hech narsa saqlanmaydi; foydalanuvchi OneID'da ruxsat bergandan **keyin** qayta urinishi kerak. |
  | `400` | `mvd_failure: "not_found"` — MVD'da bu pasport bo'yicha yozuv yo'q. Qayta urinish yordam bermaydi. |
  | `409` | `passport_conflict: true` + `conflict_phone_masked` — pasport boshqa **tirik** hisobga tegishli. Javobda o'sha hisobning yashirilgan raqami bo'ladi (`+998 ** *** 1234`), foydalanuvchi "o'sha raqam bilan kiring" deb yo'naltiriladi. |
  | `409` | `passport_conflict: true` + `requires_support: true` — pasport egasi bo'lgan hisobda telefon yo'q (MyID yaratgan eski hisob), qaysi raqam bilan kirishni ayta olmaymiz. |
  | `401` | Token yo'q yoki yaroqsiz. |

  > **Hisoblar avtomatik birlashtirilmaydi.** Ikki `candidate` ni birlashtirish hamyon,
  > ledger, arizalar, pipeline, chat va CV'larni ko'chirishni talab qiladi — keng,
  > qaytarilmas, pul ko'taradigan operatsiya. Konflikt bloklanadi, qo'lda hal qilinadi.
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
