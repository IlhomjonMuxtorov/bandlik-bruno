info:
  name: 2. Start Secondary (Reuid)
  type: http
  seq: 2
http:
  method: POST
  url: '{{base_url}}/mobile/my-id/start-secondary'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: "{\n  \"reuid\": \"9b7e597e-893e-4e11-92cf-f4e7d4f923b1\",\n  \"threshold\"\
      : 0.85\n}"
  auth:
    type: bearer
    token: '{{guest_token}}'
docs: |
  Oldingi primary tasdiqlashdan olingan `reuid` bilan sessiya ochadi — qaytgan
  foydalanuvchi faqat yuzini skanerlaydi, pasport qayta kiritilmaydi. So'ng
  `POST /mobile/my-id/verify` chaqiriladi va u to'g'ridan-to'g'ri token juftligini
  qaytaradi (**kirish** yo'li).

  > reuid `candidate.myid_reuid` da saqlanadi (primary verify paytida) va muddati bor.
  > Muddati o'tgan bo'lsa secondary ishlamaydi — primary sessiya orqali qayta tasdiqlash
  > kerak.

  > ⚠️ **Secondary sessiya shaxs tasdiqlash uchun yaramaydi.** MyID unda profil
  > qaytarmaydi, ya'ni `pass_data` ham, `birth_date` ham bo'lmaydi va MVD'dan hech nima
  > so'rab bo'lmaydi. Shuning uchun `access_token` bilan chaqirilgan `verify` secondary
  > natijani `400` bilan rad etadi. Tasdiqlash uchun `start-primary`
  > (`empty_session: true`) ishlatiladi.

  **Auth:** `guest_token` (kamida guest token).

  ### 📥 Request Body

  | Field | Type | Required | Description |
  |---|---|:---:|---|
  | `reuid` | string | ✅ | Primary verify'dan olingan qayta foydalanish ID'si (36 belgi). |
  | `phone` | string | ➖ | `+998XXXXXXXXX` — MyID tomonida bildirishnoma uchun. |
  | `threshold` | number | ➖ | Yuz moslik progi (0.6–0.99), default `0.85`. |

  ### 📤 Response

  | Field | Type | Description |
  |---|---|---|
  | `session_id` | string | MyID SDK'ga uzatiladigan sessiya identifikatori. |

  ### ⚠️ Errors

  | Code | Reason |
  |---|---|
  | `400` | Validatsiya xatosi yoki MyID sessiya ocholmadi. |
  | `401` | Token yo'q yoki yaroqsiz. |
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
