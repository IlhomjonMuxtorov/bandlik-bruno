docs: 'Viza tarixi yozuvini yangilash. Faqat yozuv egasi (nomzod) yangilay oladi.


  > **Uzbek lotin yozuvi:** `Accept-Language: uz` bo''lganda MVD dan kelgan
  kirill matn (lavozim, kompaniya, manzil, tug''ilgan joy va h.k.) avtomatik lotinga
  o''giriladi ("Етакчи муҳандис" → "Yetakchi muhandis"). Rus tilidagi matn va ism-familiya
  o''zgarmaydi; bazadagi asl matn kirillcha qoladi. `ru`/`en` da o''zgarish yo''q.
  To''liq CV (`GET /mobile/cv/{id}`) bilan bir xil qoida — ro''yxat, bitta yozuv,
  yaratish va yangilash javoblari ham lotinda qaytadi.


  **Auth:** `access_token`.


  Request body `13a. Visa History — Create` bilan bir xil. `visa_file_id` yangi qiymatga
  o''zgartirilsa, eski biriktirilgan hujjat orphan sifatida o''chiriladi.


  ### 📤 Response

  `13. Visa History — List` bilan bir xil obyekt (`200`).


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `400` | Validatsiya (Create bilan bir xil qoidalar) |

  | `401` | Token yo''q yoki eskirgan |

  | `404` | Viza yozuvi topilmadi yoki boshqa nomzodga tegishli |

  '
settings:
