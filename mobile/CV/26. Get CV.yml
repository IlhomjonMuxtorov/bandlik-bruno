info:
  name: Get CV
  type: http
  seq: 26
http:
  method: GET
  url: '{{base_url}}/mobile/cv/{{cv_id}}'
  headers:
  - name: Accept
    value: application/json
  auth: inherit
docs: 'Bitta CV-ning to''liq tafsilotlari (education, experience, languages va h.k.
  shu CV uchun).


  **Auth:** `access_token`.


  ### 📋 Path Params


  | Param | Type | Description |

  |---|---|---|

  | `cv_id` | int | CV ID |


  ### 📤 Response


  | Field | Type | Description |

  |---|---|---|

  | `header` | object | `{ cv_id, title, profession, industry, status, is_primary,
  photo_url, full_name, completion_percent, is_complete, completion, stats }` |

  | `header.profession` | string | Ko''rsatiladigan kasb: soha nomi
  (`Accept-Language` bo''yicha), soha bo''lmasa — `header.title` |

  | `header.industry` | object \| null | `{ id, name }` — CV sohasi. `null` — soha
  tanlanmagan |

  | `header.title` | string | **DEPRECATED** — erkin matn CV nomi. Soha bilan
  yaratilgan CVda bo''sh qator |

  | `header.status` | string | `draft` yoki `active` — to''liqlikdan avtomatik
  hisoblanadi (mijoz o''rnatmaydi) |

  | `header.completion_percent` | int | 0–100. **8 ta majburiy** band asosida; ixtiyoriy
  bandlar (`passport_identity`, `documents`, `health_certificate`, `courses`) foizga
  kirmaydi |

  | `header.is_complete` | bool | `true` bo''lganda CV `active` va vakansiyaga ariza
  topshirish mumkin. Faqat majburiy bandlarga qaraydi |

  | `header.completion` | object | `{ percent, is_complete, missing[], sections[] }`.
  `missing[]` — to''ldirilmagan va foydalanuvchiga ko''rsatiladigan band kalitlari:
  majburiylar + `advised` ixtiyoriylar (hozircha `health_certificate`) — shu sabab
  `is_complete: true` bo''lsa ham bo''sh bo''lmasligi mumkin; `sections[]` har bandda
  `{ key, label, required, advised, filled }` (UI checklist uchun). To''liq jadval:
  **CV Completion** so''rovi docs''ida |

  | `personal` | object | Passport asosida (CV-dan qat''iy nazar bir xil): `{ passport_id, pinpp, birth_date, full_name, sex, sex_label }` |

  | `personal.sex` \| `.sex_label` | int \| null / string \| null | **Yangi.** Jinsi, MVD `passport_data.sex` dan: `1` — erkak, `2` — ayol; `sex_label` — lokalizatsiya qilingan matn (`Erkak` \| `Ayol`). Ikkisi ham `null` — MVD hali javob bermagan |

  | `birth_place` | object | **BREAKING:** endi qat''iy MVD-derived: `{ address, country
  }`. Eski `region`/`district` kalitlari OLIB TASHLANDI (MVD ularni ajratmaydi).
  `address` kaliti QOLADI, lekin qiymati boshqa manbadan: endi MVD `birthplace`
  erkin matni (masalan tuman nomi), avvalgi "nomzod kiritgan ko''cha/uy manzili"
  EMAS; `null` — MVD topilmagan. `country` — tug''ilgan davlat, `country.gcp_code`
  orqali lokalizatsiya, bo''lmasa xom MVD qiymati (`null` — noma''lum) |

  | `passport` | object | `{ tin, foreign_passport_number, nationality, citizenship,
  had_visa_before, additional_visa_country }`. `nationality` (yangi) — `{ id, name }`:
  **millat**, fuqarolikdan FARQ QILADI (`nationality` = "O''zbek", `citizenship` =
  "O''zbekiston"); `id` = GCP `SP_ID` (`nationality.id`), `name` — lokalizatsiya,
  bo''lmasa xom MVD qiymati (`null` — MVD bermagan). `citizenship` — `{ id, name }`: `id` = GCP
  davlat kodi (`country.gcp_code`), `null` — MVD kod bermagan/davlat mos kelmagan;
  `name` — lokalizatsiya, bo''lmasa xom MVD fuqarolik qiymati. `additional_visa_country`
  — `{id, name}` \| `null` |

  | `registration` | object | Yashash manzili — MVD `MVDAddressInfoService` (`/mvd/services/address/info/pin/v1`) dan. Yuqori darajada **joriy** manzil turadi: faol vaqtinchalik ro''yxat bo''lsa o''sha, aks holda doimiy propiska. Kalitlar: `{ type, country, region, district, mahalla, street, street_type, address, cadastre, postal_code, registration_date, valid_until, full_address, permanent, temporary[] }` |

  | `registration.type` | string \| null | `permanent` — doimiy propiska \| `temporary` — vaqtinchalik ro''yxat. `null` — MVD hali sinxronlanmagan (eski nomzod, faqat erkin matn ustunlari bor) |

  | `registration.region` \| `.district` \| `.country` | string \| null | MVD `Region`/`District`/`Country` ma''lumotnomasidan bog''langan nom (`Accept-Language` bo''yicha lokalizatsiya); bog''lanmasa MVD qaytargan xom kirill nomi |

  | `registration.mahalla` | string \| null | MFY nomi — UzKad ma''lumotnomasidan lotin yozuvida; bog''lanmasa MVD `Maxalla.Value` (kirill). `null` — MFY ko''rsatilmagan |

  | `registration.street` | string \| null | Ko''cha nomi — 1C ma''lumotnomasidan lotin yozuvida (MVD `Street.Guid` kodi bo''yicha); bog''lanmasa MVD `Street.Value` (kirill) |

  | `registration.street_type` | string \| null | Ko''cha turi lokalizatsiyalangan nomi: Ko''cha \| Berk ko''cha \| O''tish \| Qishloq \| Shox ko''cha va h.k. `null` — ko''cha ma''lumotnomada topilmadi |

  | `registration.address` | string \| null | MVD `Address` — uy/xonadon darajasidagi erkin matn (masalan `Узбекистон кучаси, 58-уй`) |

  | `registration.cadastre` | string \| null | Turar-joyning kadastr raqami. `null` — MVD bermagan |

  | `registration.postal_code` | string \| null | Pochta indeksi — nomzod profilidan (MVD manzil xizmati indeks qaytarmaydi) |

  | `registration.valid_until` | string \| null | Vaqtinchalik ro''yxat muddati (`d.m.Y`). Doimiy propiskada doim `null` |

  | `registration.full_address` | string \| null | To''liq yig''ilgan manzil: `Viloyat, Tuman, MFY, Ko''cha, uy` |

  | `registration.permanent` | object \| null | Doimiy propiska yozuvi (yuqoridagi kalitlar bilan bir xil shakl). `null` — MVD doimiy propiska qaytarmagan |

  | `registration.temporary` | array | Vaqtinchalik ro''yxatlar, yangisi birinchi. Har element `permanent` bilan bir xil shaklda, `valid_until` to''ldirilgan. Bo''sh massiv — vaqtinchalik ro''yxat yo''q |

  | `education` | array | Faqat shu CV-ga tegishli |

  | `experience` | array | Faqat shu CV-ga tegishli |

  | `family` | object | Candidate-level (barcha CV-larda bir xil) |

  | `languages` | array | Candidate-level. Har element: `{ id, language, level, source, ball, certificate_url, serial_number, issued_date }`. `source=mvd` — DTM/ГЦТ CEFR sertifikatidan (`/dtm/service/certificate/v1`), read-only, eng yuqori daraja; `ball`/`certificate_url`/`serial_number`/`issued_date` faqat `mvd` uchun, aks holda `null`. `source=manual` — nomzod kiritgan |

  | `documents` | array | Faqat shu CV |

  | `driver` | object | License candidate-level, certificates CV-level. `driver.card` — guvohnoma kartasida chop etiladigan barcha maydonlar (1–12), rezyume kartani o''zi chizishi uchun; saqlangan ma''lumotdan yasaladi (GIBDD''ga bormaydi). Shakli: `GET /mobile/candidate/driver-license/card` bilan bir xil |

  | `licenses` | array | Candidate-level kasbiy/biznes litsenziyalar (AGU `/dxa/service/license/v1/pin`). Har element: `{ name, document_type, register_number, registration_date, expiry_date, organization, activity_addresses[], activity_types[], is_from_mvd }`. `is_from_mvd=true` — MVD''dan, read-only; bo''sh massiv — litsenziya yo''q |

  | `education[].is_from_mvd` | bool | `true` — MVD''dan auto (oliy diplom yoki kolej/litsey), tahrirlanmaydi |

  | `courses` | array | Faqat shu CV. Har element: `{ id, course_name, institution_name, start_date, end_date, certificate_number, certificate_file_url, duration_hours, is_from_mvd }`. `is_from_mvd=true` — MinVUZ qisqa-kurs sertifikatidan (`/minvuz/services/short-certificate/v1`), read-only; `duration_hours` — kurs soati (MVD), manualda `null` |

  | `skills` | array | Faqat shu CV. Talablar katalogining `professional_skills`
  guruhidan tanlangan kasbiy ko''nikmalar. Har element: `{ id, requirement_id, name,
  code }` — `id` = candidate_cv_skill qatori (o''chirish uchun), `requirement_id` =
  `vacancy_requirement.id`, `name` = lokalizatsiyalangan nom, `code` = ta''rif kodi
  (masalan `pc.ms_office`) yoki `null`. Taklif: `GET /mobile/skills`. CV
  to''liqligiga ta''sir qilmaydi |

  | `contact` | object | `{ phone, email, phone_is_custom, email_is_custom, additional_phone, additional_phone_owner_name, additional_phone_relationship }` — `GET /mobile/cv/{cv_id}/contact` bilan aynan bir xil. `phone`/`email` — CV override yoki profil qiymati; `additional_*` — zaxira kontakt (profil fallback yo''q, kiritilmagan bo''lsa `null`) |


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `401` | Token yo''q |

  | `404` | CV topilmadi yoki boshqa nomzodga tegishli |

  '
