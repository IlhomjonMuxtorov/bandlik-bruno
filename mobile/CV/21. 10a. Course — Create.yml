info:
  name: 10a. Course — Create
  type: http
  seq: 21
http:
  method: POST
  url: '{{base_url}}/mobile/cv/{{cv_id}}/course'
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: "{\n    \"course_name\": \"Kompyuter bilimlari kursi\",\n    \"institution_name\"\
      : \"Najot Ta'lim\",\n    \"start_date\": \"01.03.2023\",\n    \"end_date\":\
      \ \"01.06.2023\",\n    \"certificate_number\": \"NT-2023-456\",\n    \"certificate_file_id\"\
      : 42\n}"
  auth: inherit
docs: 'Yangi kurs qo''shish.


  > **Uzbek lotin yozuvi:** `Accept-Language: uz` bo''lganda MVD dan kelgan
  kirill matn (lavozim, kompaniya, manzil, tug''ilgan joy va h.k.) avtomatik lotinga
  o''giriladi ("Етакчи муҳандис" → "Yetakchi muhandis"). Rus tilidagi matn va ism-familiya
  o''zgarmaydi; bazadagi asl matn kirillcha qoladi. `ru`/`en` da o''zgarish yo''q.
  To''liq CV (`GET /mobile/cv/{id}`) bilan bir xil qoida — ro''yxat, bitta yozuv,
  yaratish va yangilash javoblari ham lotinda qaytadi.


  **Auth:** `access_token` — `is_verified=true` (tasdiqlangan shaxs) talab qilinadi.


  ### 📥 Request Body


  | Field | Type | Required | Description |

  |---|---|:---:|---|

  | `course_name` | string | ✅ | Kurs nomi |

  | `institution_name` | string | ✅ | O''quv markazi |

  | `start_date` | date | ✅ | `DD.MM.YYYY` |

  | `end_date` | date | ➖ | Tugagan sana |

  | `certificate_number` | string | ➖ | Sertifikat raqami |

  | `certificate_file_id` | int | ➖ | `/mobile/upload` orqali yuklangan sertifikat
  fayl ID |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
