info:
  name: Download CV PDF
  type: http
  seq: 30
http:
  method: GET
  url: '{{base_url}}/mobile/cv/{{cv_id}}/download-pdf?template=europass&documents=1'
  params:
  - name: template
    value: europass
    type: query
  - name: documents
    value: '1'
    type: query
  headers:
  - name: Accept
    value: application/pdf
  auth: inherit
docs: 'Nomzodning CV-sini PDF fayl sifatida yuklab oladi. Shablon `?template=` bilan
  tanlanadi va **saqlanmaydi** — har so''rovda qaytadan beriladi. Til (uz/ru/en)
  qurilma JWT-dagi `device_id` orqali aniqlanadi.


  **Rezyume ≠ ekrandagi CV.** PDF ataylab ekrandagi CV''dan tor: u tizimdan
  tashqariga chiqadigan hujjat, shu bois ichki va shaxsiy maydonlar chiqmaydi.


  **Chap ustunda — aynan 6 qator, shu tartibda:** passport raqami, tug''ilgan sana,
  tug''ilgan shahri (`birth_place.country, .address`), yashash shahri
  (`registration.country, .region` \| `.district`), millati
  (`passport.nationality.name`, bo''lmasa `passport.citizenship.name`), jinsi
  (`personal.sex_label`). Europass/Klassikda shu ustunda biriktirilgan hujjatlar
  ro''yxati ham turadi.


  **O''ng ustunda — CV to''ldirish qadamlari tartibida** (`CvCompletionDTO` ning 12
  bandi va endpointlardagi qadam raqamlari): ta''lim (3) → mehnat faoliyati (4) →
  oila a''zolari (5) → tillar (7) → hujjatlar (8) → haydovchilik guvohnomasi (9) →
  trening va sertifikatlar (10) → ko''nikmalar → qo''shimcha bo''limlar (12.x —
  xobbi, loyihalar, nashrlar, konferensiyalar va h.k., har biri **alohida** bo''lim)
  → huquqiy holat → tibbiy ma''lumotlar. Ko''nikmalar va tekshiruv bo''limlarining
  o''z qadami yo''q, shu bois raqamlilardan keyin turadi. Europass/Klassikda
  hujjatlar chap ustunda, shu sabab bu joylashuv faqat Zamonaviy va Professionalda
  ko''rinadi. **To''ldirilmagan bo''lim umuman chiqmaydi** (bo''sh sarlavha ham
  qolmaydi).


  **PDF''ga CHIQMAYDIGAN maydonlar** (ekrandagi CV''da qoladi): JSHSHIR, STIR,
  xorijiy passport raqami, hisoblangan umumiy ish tajribasi, aloqa bloki (telefon,
  email, qo''shimcha telefon, aloqa shaxsi), to''liq yashash manzili (12 maydonli
  MVD bloki), viza tarixi, hamda CV telemetriyasi — rezyume nomi, holati,
  to''ldirilganlik foizi, ko''rishlar, tashriflar, takliflar.


  **Brend belgisi** har to''rt shablonda o''ng ustun mazmuni bilan bir chizizda
  tugaydi; Zamonaviy shablonning quyuq sarlavhasida oq variant ishlatiladi.


  **Auth:** `access_token`.


  > **JSHSHIR (PINFL) PDF-ga chiqmaydi.** PDF tizimdan tashqariga chiqadigan
  artefakt, shu bois qator umuman render qilinmaydi (ADR-380). Ilovadagi CV
  ko''rinishi o''zgarmaydi. Xuddi shu mantiq bilan aloqa ma''lumotlari, to''liq
  manzil, viza tarixi va CV telemetriyasi ham chiqarilmaydi (ADR-394).


  > **Surat orientatsiyasi.** PDF generatori (mPDF) EXIF `Orientation` tegini
  o''qimaydi, shu sababli telefonda olingan tik surat PDF-da yotgan holda chiqardi.
  Endi burilish rasm piksellariga singdiriladi: yangi yuklamalar `POST /mobile/upload`
  bosqichida, avval yuklangan suratlar esa PDF render paytida. Mijoz tarafida hech
  narsa qilish kerak emas.


  > **Katta suratlar.** Ilgari 3–5 MB li telefon surati bo''lgan CV-larda PDF
  yuklab olish `500` (mPDF `pcre.backtrack_limit`) bilan uzilardi. Endi surat
  PDF-ga joylashtirilishidan oldin ko''rsatiladigan o''lchamgacha kichraytiriladi
  (sifat ko''zga bilinmaydi), shu sabab yuklab olish surat hajmidan qat''i nazar
  ishlaydi. Mijoz tarafida hech narsa qilish kerak emas.


  ### 📋 Path Params


  | Param | Type | Description |

  |---|---|---|

  | `cv_id` | int | CV ID |


  ### 🔎 Query Parameters


  | Param | Type | Required | Description |

  |---|---|:---:|---|

  | `template` | string | ➖ | Shablon: `europass` \| `modern` \| `professional`
  \| `classic`. Default: `europass`. Noma''lum qiymat xato bermaydi — `europass`
  ga qaytadi (eski havola baribir CV yuklab bersin). |

  | `documents` | bool | ➖ | `1` — "Hujjatlar bilan": biriktirilgan hujjatlar
  nomlari nuqtali ro''yxat bo''lib chiqadi (fayllarning o''zi PDF-ga
  qo''shilmaydi). `0` — "Hujjatlarsiz": hujjatlar bo''limi ham, bo''limlar ichidagi
  diplom/sertifikat fayllari ham umuman chiqmaydi. Default: `1`. |


  ### 📋 Headers


  | Header | Required | Description |

  |---|:---:|---|

  | `Authorization` | ✅ | `Bearer {access_token}` |

  | `Accept` | ✅ | `application/pdf` — aks holda `406` qaytadi |


  ### 📤 Response


  Binary PDF fayl (A4, chekkalari 8mm).


  | Header | Value |

  |---|---|

  | `Content-Type` | `application/pdf` |

  | `Content-Disposition` | `attachment; filename="<F.I.Sh>.pdf"` |

  | `Access-Control-Expose-Headers` | `Content-Disposition, Content-Length` |


  > **Fayl nomi frontendda.** Brauzer cross-origin `fetch()` da JS-ga faqat
  CORS-safelisted headerlarni beradi. Shu sabab server `Content-Disposition` va
  `Content-Length` ni `Access-Control-Expose-Headers` orqali ochadi — usiz
  `response.headers.get(''content-disposition'')` doim `null` qaytardi. Fayl nomi
  RFC 6266 `filename*=UTF-8''''...` bilan ham yuboriladi, kirill/o''zbek harflar
  buzilmaydi.


  > Bruno-da javobni ko''rish uchun **Response → Save Response** orqali `.pdf`
  qilib saqlang.


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `401` | Token yo''q yoki eskirgan |

  | `404` | CV topilmadi yoki boshqa nomzodga tegishli |

  | `406` | `Accept: application/pdf` header yuborilmagan |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
