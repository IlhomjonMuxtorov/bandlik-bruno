info:
  name: Download CV PDF
  type: http
  seq: 30
http:
  method: GET
  url: '{{base_url}}/mobile/cv/{{cv_id}}/download-pdf?template=europass&documents=1'
  params:
  - name: template
    value: europass
    type: query
  - name: documents
    value: '1'
    type: query
  headers:
  - name: Accept
    value: application/pdf
  auth: inherit
docs: 'Nomzodning CV-sini PDF fayl sifatida yuklab oladi. Shablon `?template=` bilan
  tanlanadi va **saqlanmaydi** — har so''rovda qaytadan beriladi. Til (uz/ru/en)
  qurilma JWT-dagi `device_id` orqali aniqlanadi.


  **Europass** shabloni admin paneldagi CV ko''rinishining (`EuropassCvTemplate`)
  bosma nusxasi: chapda 250px quyuq ko''k ustun (portret, F.I.Sh., asosiy
  ma''lumotlar, aloqa, biriktirilgan hujjatlar), o''ngda oq fonda bo''limlar —
  tug''ilgan joy va propiska, viza tarixi, ta''lim, mehnat faoliyati, oila,
  tillar, ko''nikmalar, trening va sertifikatlar.


  **Auth:** `access_token`.


  > **JSHSHIR (PINFL) PDF-ga chiqmaydi.** PDF tizimdan tashqariga chiqadigan
  artefakt, shu bois qator umuman render qilinmaydi (ADR-380). Ilovadagi CV
  ko''rinishi o''zgarmaydi.


  ### 📋 Path Params


  | Param | Type | Description |

  |---|---|---|

  | `cv_id` | int | CV ID |


  ### 🔎 Query Parameters


  | Param | Type | Required | Description |

  |---|---|:---:|---|

  | `template` | string | ➖ | Shablon: `europass` \| `modern` \| `professional`
  \| `classic`. Default: `europass`. Noma''lum qiymat xato bermaydi — `europass`
  ga qaytadi (eski havola baribir CV yuklab bersin). |

  | `documents` | bool | ➖ | `1` — "Hujjatlar bilan": biriktirilgan hujjatlar
  nomlari nuqtali ro''yxat bo''lib chiqadi (fayllarning o''zi PDF-ga
  qo''shilmaydi). `0` — "Hujjatlarsiz": hujjatlar bo''limi ham, bo''limlar ichidagi
  diplom/sertifikat fayllari ham umuman chiqmaydi. Default: `1`. |


  ### 📋 Headers


  | Header | Required | Description |

  |---|:---:|---|

  | `Authorization` | ✅ | `Bearer {access_token}` |

  | `Accept` | ✅ | `application/pdf` — aks holda `406` qaytadi |


  ### 📤 Response


  Binary PDF fayl (A4, chekkalari 8mm).


  | Header | Value |

  |---|---|

  | `Content-Type` | `application/pdf` |

  | `Content-Disposition` | `attachment; filename="<F.I.Sh>.pdf"` |


  > Bruno-da javobni ko''rish uchun **Response → Save Response** orqali `.pdf`
  qilib saqlang.


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `401` | Token yo''q yoki eskirgan |

  | `404` | CV topilmadi yoki boshqa nomzodga tegishli |

  | `406` | `Accept: application/pdf` header yuborilmagan |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
