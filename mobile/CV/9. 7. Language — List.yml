info:
  name: 7. Language — List
  type: http
  seq: 9
http:
  method: GET
  url: '{{base_url}}/mobile/cv/{{cv_id}}/language'
  headers:
  - name: Accept
    value: application/json
  auth: inherit
docs: 'Nomzod biladigan tillar ro''yxati.


  > **O''zgardi (2026-09):** nomzod endi **bitta tilga bir nechta yozuv** saqlashi mumkin
  — har biri boshqa shkalada (masalan ingliz tili uchun «CEFR B1» va «IELTS 6.5» yonma-yon).
  Ro''yxatni kalitlashda **`id` yoki `language_id`+`scale`** ishlating — `language_id`
  yolg''iz endi unikal emas.


  **Auth:** `access_token`.


  ### 📤 Response *(massiv elementi)*


  | Field | Type | Description |

  |---|---|---|

  | `id` | int | Yozuv ID |

  | `language` | object | `{ id, iso_code, name, scale, scales[] }` — `scale` tilning
  standart shkalasi, `scales[]` esa shu tilga biriktirilgan barcha shkalalar (`[{scale,
  label, is_default}]`) |

  | `level` | object | `{ id, code, name, scale, scale_label, score_min, score_max }` |

  | `scale` | string | Shu **yozuv** qaysi shkalada ekanligi (masalan `ielts`), `level.scale`
  bilan bir xil qiymat — guruhlash/filtrlash uchun tekis maydon sifatida qo''shildi |

  | `scale_label` | string | Shkalaning lokalizatsiyalangan nomi, masalan «IELTS (ingliz
  tili)» |

  | `source` | string | `mvd` (DTM/ГЦТ CEFR sertifikatidan, `/dtm/service/certificate/v1`,
  read-only) \| `manual` (nomzod kiritgan) |

  | `ball` | string \| null | Sertifikat to''plagan ball; faqat `mvd` uchun, aks holda `null` |

  | `certificate_url` | string \| null | Rasmiy sertifikat PDF havolasi (app.dtm.uz); faqat
  `mvd`, aks holda `null` |

  | `serial_number` | string \| null | DTM sertifikat seriyasi (masalan `22DTM1000057YN`);
  faqat `mvd`, aks holda `null` |

  | `issued_date` | date \| null | Sertifikat berilgan sana (`DD.MM.YYYY`); faqat `mvd`,
  aks holda `null` |


  > `mvd` orqali sinxronlangan yozuvlar har doim CEFR shkalasida keladi (DTM sertifikati
  CEFR balliga mos keltiriladi) — boshqa shkalalar (IELTS va h.k.) faqat `manual` bo''lishi
  mumkin.

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
