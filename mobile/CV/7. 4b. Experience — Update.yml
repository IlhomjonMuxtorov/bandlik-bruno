info:
  name: 4b. Experience — Update
  type: http
  seq: 7
http:
  method: PATCH
  url: '{{base_url}}/mobile/cv/{{cv_id}}/experience/1'
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: "{\n    \"company_name\": \"Bandlik\",\n    \"position\": \"Senior\
      \ Buxgalter\",\n    \"country_id\": 1,\n    \"city_id\": 1,\n    \"start_date\"\
      : \"15.01.2023\",\n    \"description\": \"Buxgalteriya hisobini yuritish\",\n\
      \    \"achievements\": \"Jamoani boshqardim\",\n    \"recommendation_file_id\"\
      : 42\n}"
  auth: inherit
docs: 'Mavjud tajribani yangilash. Maydonlar `create` bilan bir xil.


  ℹ️ **MVD'' dan sinxronlangan yozuvlar (`is_from_mvd=true`) — qisman muzlatilgan:**
  elektron hukumat bergan maydonlar **o''zgarmaydi** — `company_name`, `position`,
  `start_date`, `end_date` body''da yuborilsa **jim e''tiborga olinmaydi** (403 emas,
  200 qaytadi, DB''dagi qiymat o''zgarmaydi). MVD yubormaydigan maydonlar esa
  tahrirlanadi: `country_id`, `city_id`, `description` (vazifalar), `achievements`
  (yutuqlar), `recommendation_file_id`. Frontend `is_from_mvd=true` bo''lganda
  muzlatilgan 4 inputni `disabled` qilib, to''liq formani yuboraversa bo''ladi.


  **Auth:** `access_token` — `is_verified=true` (tasdiqlangan shaxs) talab qilinadi.


  ### 📥 Request Body


  | Field | Type | Required | Description |

  |---|---|:---:|---|

  | `company_name` | string | ✅ | Tashkilot nomi. 🔒 MVD yozuvida o''zgarmas |

  | `position` | string | ✅ | Lavozim. 🔒 MVD yozuvida o''zgarmas |

  | `country_id` | int | ➖ | Ish joyi davlati (`GET /mobile/countries`). Yuborilmasa
  `null` ga tushadi |

  | `city_id` | int | ➖ | Ish joyi shahri (`GET /mobile/cities?country_id=<id>`).
  Tanlangan `country_id` ga tegishli bo''lishi shart |

  | `start_date` | date | ✅ | `DD.MM.YYYY`. 🔒 MVD yozuvida o''zgarmas |

  | `end_date` | date | ➖ | `null` = hozirgacha. 🔒 MVD yozuvida o''zgarmas |

  | `description` | string | ➖ | Vazifalar va qilgan ishlar (erkin matn). Bo''sh matn
  `null` ga aylanadi |

  | `achievements` | string | ➖ | Ushbu ish o''rnidagi yutuqlar (erkin matn). Bo''sh
  matn `null` ga aylanadi |

  | `recommendation_file_id` | int | ➖ | Yangi tavsiyanoma fayl ID. Eski fayl avtomatik
  o''chiriladi. Saqlash uchun joriy qiymat bo''lsa, qaytadan yuborilsin yoki maydon
  yuborilmasin |


  > **To''liq ustiga yozish (PUT semantikasi):** yuborilmagan maydon `null` ga tushadi —
  faqat `achievements` yuborilsa `description` / `country_id` / `city_id` tozalanadi.
  Istisno — `recommendation_file_id`: yuborilmasa joriy fayl saqlanadi. Shu sabab
  formadagi barcha maydon har PATCH''da yuborilsin.

  > Validatsiya xabarlari qurilma tilida (`user_device.language`) qaytadi va maydon
  nomlari interfeys sarlavhalari bilan bir xil (`company_name` → «Tashkilot nomi»,
  `position` → «Vazifa» va h.k.).

  > `company_name` bo''sh bo''lsa maxsus matn qaytadi: «Tashkilot nomi to''ldirilishi
  shart. Tashkilot nomini eslay olmasangiz, shahar nomini kiriting.»

  '
