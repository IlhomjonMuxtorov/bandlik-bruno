info:
  name: 8a. Document — Attach
  type: http
  seq: 14
http:
  method: POST
  url: '{{base_url}}/mobile/cv/{{cv_id}}/document/{{document_id}}'
  headers:
  - name: Accept
    value: application/json
  auth: inherit
docs: |
  Profil pooldagi hujjatni shu CVga biriktirish (idempotent — qayta biriktirish
  xato bermaydi). Hujjatning o'zi `/mobile/candidate/document` orqali yaratiladi.

  > **Uzbek lotin yozuvi:** `Accept-Language: uz` bo''lganda MVD dan kelgan
  kirill matn (lavozim, kompaniya, manzil, tug''ilgan joy va h.k.) avtomatik lotinga
  o''giriladi ("Етакчи муҳандис" → "Yetakchi muhandis"). Rus tilidagi matn va ism-familiya
  o''zgarmaydi; bazadagi asl matn kirillcha qoladi. `ru`/`en` da o''zgarish yo''q.
  To''liq CV (`GET /mobile/cv/{id}`) bilan bir xil qoida — ro''yxat, bitta yozuv,
  yaratish va yangilash javoblari ham lotinda qaytadi.


  **Auth:** `access_token` — `is_verified=true` (tasdiqlangan shaxs) talab qilinadi.

  ### 🔎 Path Parameters

  | Param | Type | Description |
  |---|---|---|
  | `cv_id` | int | CV ID |
  | `id` | int | Pool hujjat ID (`/mobile/candidate/document` dan) |

  ### 📤 Response (`201 Created`)

  Biriktirilgan hujjat (List elementi bilan bir xil maydonlar).

  ### ⚠️ Errors

  | Code | Reason |
  |---|---|

  | `403` | Shaxs tasdiqlanmagan (`is_verified=false`) — javobda `verification_required: true` |

  | `456` | Guest — registratsiya tugatilmagan |
  | `403` | Hujjat boshqa nomzodga tegishli |
  | `404` | CV yoki hujjat topilmadi |
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
