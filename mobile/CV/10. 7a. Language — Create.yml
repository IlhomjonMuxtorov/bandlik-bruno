info:
  name: 7a. Language — Create
  type: http
  seq: 10
http:
  method: POST
  url: '{{base_url}}/mobile/cv/{{cv_id}}/language'
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: "{\n    \"language_id\": 1,\n    \"language_level_id\": 7\n}"
  auth: inherit
docs: 'Yangi til qo''shish.


  > **O''zgardi (2026-09):** shkala endi client tomonidan yuborilmaydi — tanlangan
  `language_level_id` qaysi shkalaga tegishli bo''lsa, yozuv shu shkalada saqlanadi
  (`scale` avtomatik hisoblanadi). Nomzod bitta tilni **bir necha marta**, har safar
  boshqa shkalada qo''sha oladi — masalan «Ingliz — CEFR B1» va «Ingliz — IELTS 6.5»
  ikkalasi ham saqlanadi. Faqat **bitta tilning bitta shkalasi** takrorlanmaydi.


  **Auth:** `access_token` — `is_verified=true` (tasdiqlangan shaxs) talab qilinadi.


  ### 📥 Request Body


  | Field | Type | Required | Description |

  |---|---|:---:|---|

  | `language_id` | int | ✅ | Reference: `GET /mobile/languages` |

  | `language_level_id` | int | ✅ | Reference: `GET /mobile/language-levels?language_id={language_id}`.
  Shkala shu darajadan avtomatik aniqlanadi — daraja tilga biriktirilgan (`language_scale`)
  shkalalardan biriga tegishli bo''lishi shart, aks holda `400`. |


  ### 📤 Response


  `201` — yaratilgan yozuv, `GET .../language` bilan bir xil element shaklida (`id`,
  `language`, `level`, `scale`, `scale_label`, `source`, …).


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `403` | Shaxs tasdiqlanmagan (`is_verified=false`) — javobda `verification_required: true` |

  | `456` | Guest — registratsiya tugatilmagan |

  | `400` | `Bu til {scale} shkalasi bilan allaqachon qo''shilgan` — shu til shu shkalada
  allaqachon mavjud (masalan ikkinchi marta IELTS qo''shilmoqchi). Boshqa shkalada (masalan
  CEFR) esa muammosiz qo''shiladi — `201`. |

  | `400` | `{scale} shkalasi bu til uchun mavjud emas.` — tanlangan daraja shu til
  sertifikatlanadigan shkalalardan biriga tegishli emas (masalan yapon tiliga IELTS
  darajasi tanlansa) |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
