info:
  name: Create CV
  type: http
  seq: 25
http:
  method: POST
  url: '{{base_url}}/mobile/cv'
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: "{\n    \"industry_id\": 1,\n    \"is_primary\": false,\n    \"document_ids\": null,\n    \"driver_certificate_ids\": null\n}"
  auth: inherit
docs: 'Yangi CV yaratish.


  **Auth:** `access_token` — `is_verified=true` (tasdiqlangan shaxs) talab qilinadi.

  > ⚠️ **Tasdiqlash faqat MyID orqali.** Ro''yxatdan o''tish endi telefon + OTP,
  > shuning uchun yangi hisob `is_verified=false` bo''ladi va CV yarata olmaydi.
  > Tasdiqlash: `POST /mobile/my-id/start-primary` (`empty_session: true`) →
  > `POST /mobile/my-id/verify`. Ilovada pasport maydoni ko''rsatilmaydi — uni MyID
  > SDK o''z ekranida so''raydi. Yuz mos kelib, MVD ma''lumot bermasa
  > (`mvd_pending: true`) hisob **hali ham tasdiqlanmagan** bo''ladi va CV
  > yaratilmaydi — `POST /mobile/my-id/retry-mvd` bilan qayta uriniladi.

  Gate ikki qatlamda: controller filtri (`RequireVerifiedUserForWriteFilter`) va
  service guard (`CandidateCvService::createCv`). Ikkalasi ham `403` +
  `verification_required: true` beradi.


  ### 📥 Request Body


  | Field | Type | Required | Description |

  |---|---|:---:|---|

  | `industry_id` | int \| null | ➖ | CV sohasi (kasb yo''nalishi). Qiymat `GET
  /mobile/vacancy-industries` dan olinadi. `null`/yuborilmasa — soha tanlanmagan. |

  | `title` | string | ➖ | **DEPRECATED** — erkin matn CV nomi. `industry_id` bilan
  almashtirilmoqda; faqat eski mijozlar uchun qoldirilgan. |

  | `photo_url` | string \| null | ➖ | CV uchun maxsus rasm (bo''lmasa candidate rasmi)
  |

  | `is_primary` | bool \| null | ➖ | `true` bo''lsa, eski primary CV avtomatik `false`
  bo''ladi. Birinchi CV bo''lsa, server avtomatik `true` qiladi |

  | `document_ids` | int[] \| null | ➖ | CVga biriktiriladigan profil hujjat ID-lari.
  `null`/yuborilmasa — nomzodning **barcha** profil hujjatlari biriktiriladi (default);
  `[]` — hech biri; `[1,5]` — faqat shular |

  | `driver_certificate_ids` | int[] \| null | ➖ | Xuddi shu mantiq haydovchilik
  sertifikatlari uchun |


  ### 📤 Response


  `201 Created` + to''liq CV (`/cv/{id}` formatida).


  > ⚙️ **status — read-only:** CV `status` (`draft`/`active`) endi mijoz tomonidan
  > yuborilmaydi. U 11 ta bo''limning to''ldirilganligidan avtomatik hisoblanadi
  > (10 ta majburiy band; qisqa muddatli kurs majburiy emas). Barcha majburiy
  > bandlar to''ldirilganda CV `active` bo''ladi va shundagina vakansiyaga ariza
  > topshirish mumkin. Foiz va qaysi band yetishmasligini `header.completion` da
  > ko''rish mumkin.


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `403` | Shaxs tasdiqlanmagan (`is_verified=false`) — javobda `verification_required: true` |

  | `456` | Guest — registratsiya tugatilmagan |

  | `400` | Validatsiya xatosi |

  | `401` | Token yo''q |


  > ✨ **Auto-save:** yaratilgan CV ning `id` si avtomatik `cv_id` sifatida saqlanadi.
  CV qismidagi barcha endpointlar shu `{{cv_id}}` ni ishlatadi.


  > 📎 **Hujjat/sertifikat pooli:** hujjat va haydovchilik sertifikatlari endi
  > candidate (profil) darajasida saqlanadi (`/mobile/candidate/document`,
  > `/mobile/candidate/driver-certificate`). CV ulardan tanlangan qismini
  > biriktiradi — yangi CVda default barchasi biriktiriladi. Keyin CV qismidagi
  > `Document/Driver Certificate — Attach/Detach` orqali boshqariladi.


  > 🔄 **MVD avtomatik sinxronlash** (server background):

  > - Diplomalar — MinVUZ servisidan kelib `candidate_education` ga yoziladi

  > - Mehnat tarixi — Mintud servisidan kelib `candidate_experience` ga yoziladi

  > - Nikoh ma''lumoti — ZAGS dan kelib `candidate_spouse` ga yoziladi va
  > `candidate.marital_status` (`married` / `divorced` / `widowed`) avtomatik
  > o''rnatiladi. Foydalanuvchi `marital_status` ni qo''lda o''zgartirmaydi.

  > - Propiska manzil — MVD address servisidan kelib `candidate.registration_*`
  > maydonlariga yoziladi (faqat bo''sh bo''lganda).

  > - Haydovchilik guvohnomasi — MVD/GIBDD dan kelib `candidate_driver_license` ga
  > yoziladi (`source=mvd_gibdd`). Qo''lda kiritilgan yozuv (`source=manual`)
  > **ustiga yozilmaydi**; yuklangan skan fayl saqlanadi.

  >

  > Agar tegishli MVD xizmat topa olmasa yoki xato bersa — log ga yoziladi,
  > CV yaratish baribir davom etadi.

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
runtime:
  scripts:
  - type: after-response
    code: "const body = res.getBody();\nif (body && body.id) {\n  bru.setEnvVar('cv_id',\
      \ String(body.id));\n  console.log('cv_id saved: ' + body.id);\n}"
