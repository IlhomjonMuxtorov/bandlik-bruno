info:
  name: 8. Document — List
  type: http
  seq: 13
http:
  method: GET
  url: '{{base_url}}/mobile/cv/{{cv_id}}/document'
  headers:
  - name: Accept
    value: application/json
  auth: inherit
docs: |
  Shu CVga biriktirilgan hujjatlar ro'yxati. Hujjatlar candidate'ning profil
  pooliga tegishli (`/mobile/candidate/document`); bu yerda CVga biriktirilgan
  qismi ko'rinadi.

  > **Uzbek lotin yozuvi:** `Accept-Language: uz` bo''lganda MVD dan kelgan
  kirill matn (lavozim, kompaniya, manzil, tug''ilgan joy va h.k.) avtomatik lotinga
  o''giriladi ("Етакчи муҳандис" → "Yetakchi muhandis"). Rus tilidagi matn va ism-familiya
  o''zgarmaydi; bazadagi asl matn kirillcha qoladi. `ru`/`en` da o''zgarish yo''q.
  To''liq CV (`GET /mobile/cv/{id}`) bilan bir xil qoida — ro''yxat, bitta yozuv,
  yaratish va yangilash javoblari ham lotinda qaytadi.


  **Auth:** `access_token`.

  ### 📤 Response *(massiv elementi)*

  | Field | Type | Description |
  |---|---|---|
  | `id` | int | Hujjat ID (pooldagi) |
  | `type` | string | `passport_scan` \| `foreign_passport_scan` \| `criminal_record_scan` \| `photo_3x4_scan` \| `health_certificate_scan` |
  | `title` | string | Fayl nomi |
  | `file_url` | string \| null | Fayl URL |
  | `file_size` | int \| null | Bayt |
  | `file_kind` | string \| null | `pdf` \| `image` \| `word` \| `excel` \| `other` |
  | `file_kind_icon_url` | string \| null | Standart ikonkaga to'liq URL |
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
