info:
  name: Messages
  type: http
  seq: 3
http:
  method: GET
  url: '{{base_url}}/mobile/chats/1/messages?limit=30'
  body:
    type: none
  auth: inherit
docs: |
  Paginated xabarlar (cursor pagination, eng yangidan eskigacha).

  **Auth:** `access_token`.

  ### 🔎 Query Parameters

  | Param | Type | Required | Description |
  |---|---|:---:|---|
  | `before_id` | int | ➖ | Eski xabarlarni yuklash uchun (scroll up). Shu ID dan oldingilar |
  | `after_id` | int | ➖ | FCM push qabul qilingach delta sync uchun |
  | `limit` | int | ➖ | Default `30`, max `100` |

  ### 📋 Headers

  | Header | Required | Description |
  |---|:---:|---|
  | `Authorization` | ✅ | `Bearer {access_token}` |

  ### 📤 Response

  Massiv (DESC, eng yangi birinchi):

  | Field | Type | Description |
  |---|---|---|
  | `id` | int | message id |
  | `conversation_id` | int | |
  | `type` | string | `text` \| `voice` \| `image` \| `document` \| `candidate_card` \| `offer` \| `rejection` \| `system` \| `call` |
  | `type_label` | string | tarjima qilingan |
  | `body` | string \| null | matn (yoki ovoz/rasm uchun caption). `rejection` uchun **doim to'ldirilgan** — rad etish matni + yangi qatorda `Sabab: ...` |
  | `sender` | object \| null | `{id, username, full_name?, profile_photo_url?}` — system message uchun `null`. XBA xodimi bo'lsa `full_name` va `profile_photo_url` qo'shiladi |
  | `attachment` | object \| null | `{id, name, mime_type, size, file_kind, file_kind_icon_url, url}` — `size` baytlarda, `file_kind_icon_url` fayl turi ikonkasi (`other` uchun `null`) |
  | `voice_duration_sec` | int \| null | faqat `type=voice` da |
  | `system_payload` | object \| null | system msg ma'lumotlari (offer, rejection, call payload, candidate_card snapshot). `rejection` da: `{application_id, vacancy_id, vacancy_title, rejection_reason, rejected_at}` |
  | `reply_to_id` | int \| null | |
  | `is_mine` | bool | viewer xabar muallifimi |
  | `is_read` | bool | viewer o'qiganmi |
  | `created_at` | int | unix ts |
  | `created_at_formatted` | string | `d.m.Y H:i` (Asia/Tashkent) |

  > **`offer` xabari (= "XBA bilan ish boshlashga taklif"):** ariza qabul qilinganda
  > yuboriladi. `type_label` endi **"XBA bilan ish boshlashga taklif"** (ilgari "Job offer").
  > Bu xabarga **XBA xizmat ko'rsatish shartnomasi PDF** `attachment` sifatida ilanadi
  > (`mime_type: application/pdf`) — nomzod uni ochib o'qiydi va so'ng taklifni qabul qiladi.
  > Shartnomada Buyurtmachi (nomzod) va Ijrochi (XBA tashkiloti) maydonlari avtomatik
  > to'ldiriladi; moliyaviy summalar, raqam, sanalar va imzolar bo'sh qoldiriladi.
  > PDF generatsiyasi muvaffaqiyatsiz bo'lsa, xabar `attachment` siz keladi.

  > **`rejection` xabari:** `type_label` — "Ariza rad etildi" (sarlavha sifatida
  > ko'rsatiladi), `body` esa uning ostidagi tavsif matni. `body` **hech qachon `null`
  > emas**: tashkilotning `application_rejected` shabloni bo'lmasa standart matn
  > ishlatiladi, va admin kiritgan sabab oxirgi qatorda `Sabab: {sabab}` ko'rinishida
  > qo'shiladi (shablonda `{rejection_reason}` bo'lsa takrorlanmaydi). Xom sabab
  > `system_payload.rejection_reason` da ham keladi. Til — nomzod qurilmasining tili.

  ### ⚠️ Errors

  | Code | Reason |
  |---|---|
  | `401` | Token yo'q |
  | `403` | Chat boshqa nomzodga tegishli |
  | `404` | Chat topilmadi |
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
