info:
  name: 9. Driver License — Get
  type: http
  seq: 10
http:
  method: GET
  url: '{{base_url}}/mobile/candidate/driver-license'
  headers:
  - name: Accept
    value: application/json
  auth: inherit
docs: 'Haydovchilik guvohnomasi + sertifikatlar.


  **Auth:** `access_token`.


  ### 📤 Response


  | Field | Type | Description |

  |---|---|---|

  | `has_license` | bool | Guvohnoma bormi |

  | `categories` | string \| null | Vergul bilan ajratilgan toifalar (`A,B,C,D,E,BE,CE,DE,TM,TB`
  ichidan). Masalan `A,B,C`. Bu `categories_detail` ning qisqa proyeksiyasi — ikkisi
  doim bir xil to''plamni bildiradi |

  | `categories_detail` | array | Har toifa uchun alohida amal qilish oynasi (karta
  9–12 maydonlari). Toifa yo''q bo''lsa `[]`. Tartib — guvohnoma kartasidagi tartib
  (`A, B, C, D, E, BE, CE, DE, TM, TB`), alifbo emas; `categories` CSV ham shu tartibda |

  | `license_number` | string \| null | Guvohnoma raqami |

  | `issue_date` | date \| null | Berilgan sana |

  | `expiry_date` | date \| null | Amal qilish muddati |

  | `file_id` | int \| null | Guvohnoma skan fayl ID si |

  | `file_url` | string \| null | Skan faylga to''g''ri URL |

  | `file_size` | int \| null | Fayl o''lchami (bayt) |

  | `file_kind` | string \| null | `image` \| `pdf` \| ... |

  | `file_kind_icon_url` | string \| null | Fayl turi ikonkasi |

  | `source` | string \| null | Yozuv manbasi: `manual` (foydalanuvchi qo''lda kiritgan)
  \| `mvd_gibdd` (CV yaratishda MVD/GIBDD''dan avtomatik olingan) |

  | `certificates` | array | `[{ id, type, title, … }]` — Code 95 / ADR / Chip karta
  sertifikatlari |


  **`categories_detail` elementi:**


  | Field | Type | Description |

  |---|---|---|

  | `category` | string | `A` \| `B` \| `C` \| `D` \| `E` \| `BE` \| `CE` \| `DE`
  \| `TM` \| `TB` |

  | `issue_date` | string \| null | Shu toifa uchun berilgan sana `DD.MM.YYYY` (karta
  10-maydoni). `null` — manba sanani bermagan |

  | `expiry_date` | string \| null | Shu toifa uchun amal qilish muddati (11) |

  | `note` | string \| null | Toifaga tegishli qo''shimcha ma''lumot (12) |

  | `source` | string | Shu satr manbasi: `manual` \| `mvd_gibdd` |


  > CV birinchi marta yaratilganda haydovchilik guvohnomasi MVD/GIBDD servisidan
  avtomatik to''ldiriladi (`source=mvd_gibdd`) — toifa satrlari ham. Foydalanuvchi
  `PUT` orqali qo''lda tahrir qilsa, `source=manual` bo''ladi va keyingi CV
  yaratishlarda MVD uni ustiga yozmaydi.


  > Jadval qo''shilishidan oldin saqlangan guvohnomalarda `categories_detail`
  satrlari mavjud (CSV''dan ko''chirilgan), lekin `issue_date`/`expiry_date` —
  `null`: eski sxema toifa sanalarini saqlamagan.

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
