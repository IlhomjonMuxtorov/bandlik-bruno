info:
  name: 2. Unread Count
  type: http
  seq: 2
http:
  method: GET
  url: '{{base_url}}/mobile/notifications/unread-count'
  body:
    type: none
  auth: inherit
docs: |
  Yagona badge endpoint'i: o'qilmagan bildirishnomalar **va** o'qilmagan chat
  xabarlari bitta so'rovda. O'chirilgan bildirishnomalar hisobga olinmaydi.

  **Auth:** `access_token`.

  ### 📤 Response

  | Field | Type | Description |
  |---|---|---|
  | `notifications` | int | O'qilmagan bildirishnomalar soni |
  | `chats` | int | Nomzodning ko'rinadigan chatlaridagi o'qilmagan xabarlar soni |
  | `total` | int | `notifications + chats` — umumiy badge |

  ### ⚠️ Errors

  | Code | Reason |
  |---|---|
  | `401` | Token yo'q yoki yaroqsiz |
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
