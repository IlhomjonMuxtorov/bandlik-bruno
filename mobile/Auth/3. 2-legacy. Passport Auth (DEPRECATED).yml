info:
  name: 2-legacy. Passport Auth (DEPRECATED)
  type: http
  seq: 3
http:
  method: POST
  url: '{{base_url}}/mobile/auth/passport'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: "{\n  \"passport_series\": \"AA\",\n  \"passport_number\": \"1234567\",\n\
      \  \"birth_date\": \"15.05.1990\",\n  \"phone\": \"+998901234567\",\n  \"device_id\"\
      : \"{{device_id}}\"\n}"
  auth:
    type: bearer
    token: '{{guest_token}}'
docs: '> 🛑 **DEPRECATED — `POST /mobile/auth/phone` bilan almashtirildi.** Bu endpoint
  faqat telefon-only ro''yxatdan o''tishdan OLDIN chiqarilgan mobil build''lar uchun
  saqlanadi va `app_setting.mobile_passport_auth_enabled` (default `true`) bayrog''i
  orqali boshqariladi. Bayroq **o''chirilganda** endpoint so''rovni umuman qayta ishlamaydi
  — o''rniga `400` + `{ "app_update_required": true }` va xabar `Please update the
  app to continue.` qaytaradi. Yangi ilova endi **umuman pasport maydonini ko''rsatmaydi**
  — manual pasport kiritish butunlay olib tashlangan, boshqa joyga ko''chirilmagan;
  shaxs faqat MyID orqali tasdiqlanadi (qarang "🪪 MyID" papkasi).


  Pasport ma''lumotlarini **MVD GCP API** orqali tekshiradi va ko''rsatilgan telefonga
  OTP yuboradi.


  > **Pasport MVD''da TOPILMASA yoki OneID tomonidan BLOKLANGAN bo''lsa — ro''yxatdan
  o''tish `400` bilan RAD ETILADI** (foydalanuvchi seriya/raqam/tug''ilgan sanani
  tekshirishi kerak; OTP yuborilmaydi).
  >
  > **MVD xizmati vaqtincha ishlamasa** (token/network/server 5xx) ro''yxatdan o''tish
  RAD ETILMAYDI: OTP yuboriladi va foydalanuvchi *tasdiqlanmagan mijoz*
  (`is_verified: false`) sifatida davom etadi. Endi tasdiqlash faqat **MyID** orqali
  amalga oshiriladi — `verify-identity` endpoint''i endi mavjud emas.


  **Auth:** `guest_token` (1-qadamdan olingan).


  ### 📥 Request Body


  | Field | Type | Required | Description |

  |---|---|:---:|---|

  | `passport_series` | string | ✅ | 2 harf (`AA`, `AB`, …). Backend uppercase qiladi.
  |

  | `passport_number` | string | ✅ | 7 raqam (`1234567`). |

  | `birth_date` | string | ✅ | `DD.MM.YYYY` (masalan: `15.05.1990`). MVD tekshiruvi
  uchun. |

  | `phone` | string | ✅ | E.164 format (`+998901234567`). OTP shu raqamga yuboriladi.
  |

  | `device_id` | string | ✅ | UUID. Pasport ma''lumotlari shu qurilmaga bog''lanadi.
  |


  **Sandbox telefonlar:** `+998900000001` → kod `111111`, `+998900000002` → kod `222222`.


  ### 📤 Response


  | Field | Type | Description |

  |---|---|---|

  | `phone_masked` | string | Yashirilgan raqam: `+998 ** *** 5678` |

  | `expires_in` | int | OTP amal qilish vaqti soniyalarda (`180`) |


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `400` | `mobile_passport_auth_enabled` o''chirilgan → `{ "app_update_required":
  true }`, xabar: `Please update the app to continue.` Ilova `/mobile/auth/phone`ga
  o''tishi kerak. |

  | `400` | Validatsiya xatosi |

  | `400` | MVD: pasport topilmadi — ma''lumotlarni tekshiring (OTP yuborilmaydi) |

  | `400` | MVD: pasport OneID tomonidan bloklangan (OTP yuborilmaydi) |

  | `400` | MVD: pasport muddati o''tgan (ma''lumot bor, lekin amal qilmaydi) |

  | `400` | OTP rate limit (telefon uchun so''rovlar oshdi) |

  | `400` | SMS yuborishda xatolik |

  | `401` | `guest_token` yo''q yoki muddati o''tgan |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
