  headers:
  - name: Accept
    value: application/json
  auth: inherit
docs: 'Foydalanuvchi o''zi yuklagan faylni o''chiradi. `204 No Content`.


  Operatsiya idempotent emas (qayta chaqirilsa `404` qaytadi). Fayl boshqa entity
  (CV, hujjat, avatar va h.k.) tomonidan ishlatilayotgan bo''lsa **o''chirilmaydi** va
  `409 Conflict` qaytadi — avval biriktirishni olib tashlang.


  **Auth:** `access_token` (Bearer).


  ### 📋 Path Parameters


  | Param | Turi | Majburiy | Izoh |

  |---|---|:---:|---|

  | `id` | int | ✅ | `upload_file.id` — faqat hozirgi foydalanuvchi yuklagan
  fayl |


  ### 📤 Response


  - `204 No Content` — muvaffaqiyatli o''chirildi


  > Xato javoblari mobil envelope''da qaytadi: `{ "status_code": 403, "message": "You
  can only delete your own files", "errors": [] }`.


  ### ⚠️ Xatolar


  | Kod | Sabab |

  |---|---|

  | `401` | Token yo''q yoki muddati o''tgan |

  | `403` | Fayl boshqa foydalanuvchiga tegishli |

  | `404` | Fayl topilmadi |

  | `409` | Fayl CV/hujjat/avatarga biriktirilgan — avval biriktirishni olib tashlang |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
