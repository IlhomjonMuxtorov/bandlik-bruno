info:
  name: 9. Get My Profile
  type: http
  seq: 1
http:
  method: GET
  url: '{{base_url}}/mobile/candidate/profile'
  headers:
  - name: Accept
    value: application/json
  auth: inherit
docs: 'Ro''yxatdan o''tgan nomzodning qisqa profil kartochkasi — **MVD** dan olingan
  ism/fuqarolik, rasm, hamyon balansi va umumiy ish tajribasi.


  > Faqat `TYPE_CANDIDATE` (`type=4`) foydalanuvchilar uchun.


  > To''liq profil (pasport, manzil, ta''lim, tajriba ro''yxati, huquqiy/tibbiy
  holat) uchun — `GET /mobile/candidate/profile-full`.


  **Auth:** `access_token`.


  ### 📋 Headers


  | Header | Required | Description |

  |---|:---:|---|

  | `Authorization` | ✅ | `Bearer {access_token}` |

  | `Accept-Language` | ➖ | `uz` \| `ru` \| `en`. Default: `uz`. `citizenship.name`
  va `work_experience` matnini tanlaydi |


  ### 📤 Response


  | Field | Type | Description |

  |---|---|---|

  | `id` | int | Foydalanuvchi ID |

  | `phone` | string \| null | E.164 (`+998XXXXXXXXX`). `null` — hali tasdiqlanmagan
  |

  | `is_verified` | bool | Pasport MVD orqali tasdiqlangan |

  | `full_name_latin` | string \| null | MVD: `SURNAME NAME PATRONYM` lotin. `null`
  — MVD ma''lumoti yo''q |

  | `citizenship` | object | `{ id, name }` — MVD-derived fuqarolik. `id` — GCP davlat
  kodi (`country.gcp_code`); `null` — MVD kod bermagan yoki davlat mos kelmagan. `name`
  — `country` relation orqali lokalizatsiya, bo''lmasa xom MVD fuqarolik qiymati;
  `null` — MVD ma''lumoti yo''q |

  | `photo_url` | string \| null | Nomzod yuklagan rasm, bo''lmasa MVD pasport rasmi.
  `null` — ikkalasi ham yo''q |

  | `work_experience` | string | **O''ZGARDI (int → string).** Umumiy ish tajribasi
  — lokalizatsiya qilingan matn: `3 yil 2 oy`. Barcha CV''lardagi tajriba yozuvlarining
  eng erta boshlanish sanasidan eng kech tugash sanasigacha (davom etayotgan ish
  bo''lsa — bugungi kungacha) oralig''i. Tajriba yo''q bo''lsa `0 oy`. Til `Accept-Language`
  ga bog''liq (`ru`: `3 г. 2 мес.`, `en`: `3 years 2 months`) |

  | `balance` | float | Joriy (sarflanadigan) balans, so''m. Hold''ni o''z ichiga
  olmaydi |

  | `hold_balance` | float | Hold (band) qilingan balans, so''m. Xizmat bosqichlari
  uchun zahiraga olingan summa |


  ### ⚠️ Errors


  | Code | Reason |

  |---|---|

  | `401` | `access_token` yo''q yoki muddati o''tgan |

  | `403` | Foydalanuvchi `TYPE_CANDIDATE` emas |

  '
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
